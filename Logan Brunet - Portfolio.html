document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: url(\"3dc46676-2c8c-4be7-acc5-7dd048300099\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cc91e573-e890-449b-8ef3-80ff11baaaae\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n<style>\n:root {\n  --bg:      #0a0b0e;\n  --panel:   #11131a;\n  --panel-2: #161922;\n  --panel-3: #1c2030;\n  --line:    rgba(180,200,230,.08);\n  --line-2:  rgba(180,200,230,.14);\n  --text:    #e3e6ed;\n  --text-2:  #b3b8c5;\n  --muted:   #7d8597;\n  --faint:   #4f5466;\n  --accent:  #56d8ff;\n  --shipped: #b3ec59;\n  --inprog:  #ffba48;\n  --info:    #9d8bff;\n  --ai:      #ff9d6a;\n  --grid:    rgba(180,200,230,.04);\n  --radius:  8px;\n  --font:    \"Geist\", system-ui, sans-serif;\n  --mono:    \"Geist Mono\", ui-monospace, monospace;\n  --shadow:  0 1px 0 rgba(255,255,255,.02), 0 8px 32px rgba(0,0,0,.5);\n}\n*,*::before,*::after { box-sizing:border-box; }\nhtml,body { margin:0; padding:0; }\nhtml { -webkit-font-smoothing:antialiased; }\nbody {\n  background:var(--bg); color:var(--text);\n  font-family:var(--font); font-size:15px; line-height:1.5;\n  min-height:100vh;\n}\nbody::before {\n  content:\"\"; position:fixed; inset:0;\n  background-image:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);\n  background-size:24px 24px; pointer-events:none; z-index:0;\n}\na { color:inherit; text-decoration:none; }\nbutton { font:inherit; cursor:pointer; }\n\n/* ── Layout ── */\n.page { max-width:1160px; margin:0 auto; padding:64px 32px 100px; position:relative; z-index:1; }\n\n/* ── Hero ── */\n.hero { padding:0 0 64px; border-bottom:1px solid var(--line); margin-bottom:64px; }\n.hero-badge {\n  display:inline-flex; align-items:center; gap:8px;\n  font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em;\n  color:var(--shipped); margin-bottom:20px;\n}\n.hero-badge-dot {\n  width:8px; height:8px; border-radius:50%;\n  background:var(--shipped); box-shadow:0 0 8px var(--shipped);\n  animation:pulse 2.4s ease-in-out infinite;\n}\n@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.45;} }\n.hero-name {\n  font-family:var(--font); font-size:clamp(42px,5.5vw,72px);\n  line-height:1.0; font-weight:500; letter-spacing:-.025em;\n  color:var(--text); margin:0 0 10px;\n}\n.hero-role { font-size:18px; color:var(--text-2); margin:0 0 18px; font-weight:400; }\n.hero-bio {\n  font-size:15.5px; line-height:1.65; color:var(--text-2);\n  max-width:54ch; margin:0 0 28px; text-wrap:pretty;\n}\n.hero-skills { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:32px; }\n.hero-skill {\n  font-family:var(--mono); font-size:11px;\n  padding:4px 12px; border:1px solid var(--line-2); border-radius:100px;\n  color:var(--text-2); background:var(--panel);\n}\n.hero-links { display:flex; flex-wrap:wrap; gap:18px; align-items:center; }\n.hero-link {\n  font-family:var(--mono); font-size:12px; letter-spacing:.04em;\n  color:var(--muted); border-bottom:1px dashed var(--line-2); padding-bottom:2px;\n  transition:color .15s, border-color .15s;\n}\n.hero-link:hover { color:var(--text); border-color:var(--text); }\n.hero-link.primary { color:var(--accent); border-color:var(--accent); }\n\n/* ── Section head ── */\n.sec-head { display:flex; align-items:baseline; gap:14px; margin-bottom:28px; }\n.sec-num  { font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.1em; }\n.sec-title { font-size:24px; font-weight:500; letter-spacing:-.005em; }\n.sec-rule  { flex:1; height:1px; background:var(--line); margin-bottom:6px; }\n.sec-sub   { font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }\n\n/* ── Project grid (main, clickable cards) ── */\n.projects { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:72px; }\n\na.project-card {\n  background:var(--panel); border:1px solid var(--line);\n  border-radius:var(--radius); overflow:hidden;\n  display:flex; flex-direction:column;\n  box-shadow:var(--shadow); cursor:pointer;\n  transition:border-color .2s, transform .2s, box-shadow .2s;\n}\na.project-card:hover {\n  border-color:var(--accent);\n  transform:translateY(-3px);\n  box-shadow:0 0 0 1px color-mix(in oklab,var(--accent) 20%,transparent), 0 12px 40px rgba(0,0,0,.5);\n}\n.project-thumb {\n  height:180px; background:var(--panel-2);\n  display:flex; align-items:center; justify-content:center;\n  border-bottom:1px solid var(--line);\n  position:relative; overflow:hidden;\n}\n.project-thumb img { width:100%; height:100%; object-fit:cover; display:block; }\n.project-thumb-placeholder {\n  display:flex; flex-direction:column; align-items:center; gap:10px; opacity:.35;\n}\n.project-thumb-label {\n  font-family:var(--mono); font-size:10px; text-transform:uppercase;\n  letter-spacing:.12em; color:var(--muted);\n}\n.project-status-bar {\n  position:absolute; top:10px; left:10px;\n  font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em;\n  padding:3px 9px; border-radius:100px;\n  background:var(--panel); border:1px solid var(--line);\n}\n.project-status-bar.live   { color:var(--shipped); border-color:color-mix(in oklab,var(--shipped) 30%,var(--line)); }\n.project-status-bar.active { color:var(--inprog);  border-color:color-mix(in oklab,var(--inprog)  30%,var(--line)); }\n\n.project-body { padding:20px 22px; flex:1; display:flex; flex-direction:column; gap:8px; }\n.project-eyebrow { font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }\n.project-title { font-size:20px; font-weight:500; letter-spacing:-.005em; color:var(--text); line-height:1.2; }\n.project-blurb { font-size:13.5px; color:var(--text-2); line-height:1.6; flex:1; text-wrap:pretty; }\n.project-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }\n.project-tag {\n  font-family:var(--mono); font-size:9.5px;\n  padding:2px 8px; border-radius:100px;\n  background:var(--panel-2); border:1px solid var(--line); color:var(--muted);\n}\n.project-arrow {\n  display:flex; align-items:center; justify-content:space-between;\n  padding:12px 22px 16px; border-top:1px solid var(--line);\n  font-family:var(--mono); font-size:10.5px; color:var(--faint);\n}\n.project-arrow .arrow { color:var(--accent); font-size:14px; transition:transform .15s; }\na.project-card:hover .arrow { transform:translateX(3px); }\n\n/* ── Thumb icon ── */\n.thumb-icon { width:44px; height:44px; opacity:.5; }\n\n/* ── Contributions grid (smaller cards) ── */\n.contribs { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:72px; }\n.contrib-card {\n  background:var(--panel); border:1px solid var(--line);\n  border-radius:var(--radius); padding:18px 20px;\n  display:flex; flex-direction:column; gap:8px;\n  transition:border-color .2s;\n}\na.contrib-card { cursor:pointer; }\na.contrib-card:hover { border-color:var(--line-2); }\n.contrib-title { font-size:15px; font-weight:500; color:var(--text); }\n.contrib-repo  { font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.04em; }\n.contrib-blurb { font-size:12.5px; color:var(--text-2); line-height:1.55; flex:1; }\n.contrib-tags  { display:flex; flex-wrap:wrap; gap:5px; }\n.contrib-tag   {\n  font-family:var(--mono); font-size:9px;\n  padding:2px 7px; border-radius:100px;\n  background:var(--panel-2); border:1px solid var(--line); color:var(--muted);\n}\n.contrib-status {\n  font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.1em;\n  padding:2px 8px; border-radius:100px; align-self:flex-start;\n  color:var(--shipped); background:color-mix(in oklab,var(--shipped) 10%,transparent);\n  border:1px solid color-mix(in oklab,var(--shipped) 25%,transparent);\n}\n\n/* ── AI workflow section ── */\n.ai-section {\n  background:var(--panel); border:1px solid color-mix(in oklab,var(--ai) 20%,var(--line));\n  border-radius:var(--radius); padding:36px 40px; margin-bottom:72px;\n  position:relative; overflow:hidden;\n}\n.ai-section::before {\n  content:\"\"; position:absolute; top:0; left:0; right:0; height:2px;\n  background:linear-gradient(90deg, var(--ai), var(--info), var(--accent));\n}\n.ai-section-head {\n  display:flex; align-items:flex-start; justify-content:space-between;\n  gap:24px; margin-bottom:24px;\n}\n.ai-section-title {\n  font-size:22px; font-weight:500; color:var(--text); margin:0 0 6px;\n}\n.ai-section-sub { font-size:14px; color:var(--text-2); max-width:54ch; text-wrap:pretty; }\n.ai-badge {\n  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em;\n  padding:5px 12px; border-radius:100px; flex-shrink:0; align-self:flex-start;\n  color:var(--ai); background:color-mix(in oklab,var(--ai) 10%,transparent);\n  border:1px solid color-mix(in oklab,var(--ai) 25%,transparent);\n}\n.ai-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }\n.ai-card {\n  background:var(--panel-2); border:1px solid var(--line);\n  border-radius:6px; padding:16px 18px;\n}\n.ai-card-title { font-size:13px; font-weight:500; color:var(--text); margin-bottom:6px; }\n.ai-card-body  { font-size:12.5px; color:var(--text-2); line-height:1.55; }\n.ai-highlight  { color:var(--ai); }\n\n/* ── Footer ── */\nfooter {\n  padding-top:24px; border-top:1px solid var(--line);\n  display:flex; justify-content:space-between; align-items:center;\n  color:var(--muted); font-family:var(--mono); font-size:11px;\n}\n\n/* ── Responsive ── */\n@media (max-width:900px) {\n  .projects, .contribs, .ai-grid { grid-template-columns:repeat(2,1fr); }\n}\n@media (max-width:600px) {\n  .projects, .contribs, .ai-grid { grid-template-columns:1fr; }\n  .hero-name { font-size:clamp(36px,10vw,56px); }\n  .ai-section-head { flex-direction:column; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"page\">\n\n  <!-- ── Hero ── -->\n  <header class=\"hero\">\n    <div class=\"hero-badge\">\n      <span class=\"hero-badge-dot\"><\u002Fspan>\n      open to work · Orlando, FL\n    <\u002Fdiv>\n    <h1 class=\"hero-name\">Logan Brunet<\u002Fh1>\n    <p class=\"hero-role\">Senior C++ Engineer · Game Tools &amp; Immersive Tech<\u002Fp>\n    <p class=\"hero-bio\">\n      Specializing in game engine tooling, real-time rendering, and immersive experiences.\n      Comfortable owning full technical stacks from engine client through deployment —\n      Unreal Engine, Dear ImGui, C++17, Lua, C#, GLSL/HLSL, and more.\n    <\u002Fp>\n    <div class=\"hero-skills\">\n      <span class=\"hero-skill\">C++17/20<\u002Fspan>\n      <span class=\"hero-skill\">Unreal Engine 4/5<\u002Fspan>\n      <span class=\"hero-skill\">Dear ImGui<\u002Fspan>\n      <span class=\"hero-skill\">Lua / Sol2<\u002Fspan>\n      <span class=\"hero-skill\">C# / WPF<\u002Fspan>\n      <span class=\"hero-skill\">GLSL / HLSL<\u002Fspan>\n      <span class=\"hero-skill\">SDL3 / CMake<\u002Fspan>\n      <span class=\"hero-skill\">Claude Code<\u002Fspan>\n    <\u002Fdiv>\n    <nav class=\"hero-links\">\n      <a href=\"https://github.com/lobotomy-x\" class=\"hero-link primary\" target=\"_blank\" rel=\"noopener\">GitHub ↗<\u002Fa>\n      <a href=\"https://linkedin.com/in/logan-brunet\" class=\"hero-link\" target=\"_blank\" rel=\"noopener\">LinkedIn ↗<\u002Fa>\n      <a href=\"mailto:loganwbrunet@gmail.com\" class=\"hero-link\">loganwbrunet@gmail.com<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- ── § 01 Selected work ── -->\n  <section>\n    <div class=\"sec-head\">\n      <span class=\"sec-num\">§ 01<\u002Fspan>\n      <h2 class=\"sec-title\">Selected work<\u002Fh2>\n      <div class=\"sec-rule\"><\u002Fdiv>\n      <span class=\"sec-sub\">click any card<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"projects\">\n\n      <!-- ImGuiColorTextEdit -->\n      <a href=\"index.html\" class=\"project-card\">\n        <div class=\"project-thumb\">\n          <img src=\"1def8df2-da96-4255-a2c2-ab626f28a229\" alt=\"ImGuiColorTextEdit editor screenshot\" onerror=\"this.style.display='none';this.nextElementSibling.style.display='flex'\">\n          <div class=\"project-thumb-placeholder\" style=\"display:none;flex-direction:column;align-items:center;gap:10px;\">\n            <svg class=\"thumb-icon\" viewBox=\"0 0 48 48\" fill=\"none\">\n              <path d=\"M16 12 L8 24 L16 36\" stroke=\"#b3ec59\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n              <path d=\"M32 12 L40 24 L32 36\" stroke=\"#56d8ff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n              <line x1=\"24\" y1=\"10\" x2=\"24\" y2=\"38\" stroke=\"#56d8ff\" stroke-width=\"2.5\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fline>\n            <\u002Fsvg>\n            <span class=\"project-thumb-label\">ImGuiColorTextEdit<\u002Fspan>\n          <\u002Fdiv>\n          <span class=\"project-status-bar live\">Shipped<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"project-body\">\n          <div class=\"project-eyebrow\">C++ · Dear ImGui · Engine Tooling<\u002Fdiv>\n          <div class=\"project-title\">ImGuiColorTextEdit<\u002Fdiv>\n          <div class=\"project-blurb\">\n            Transformed a capable code editor into a fully featured IDE on par with Sublime Text —\n            code folding, script runner, VS Code shortcuts, doubled language support,\n            drag-and-drop, and professional file dialogs. Cross-platform: Windows, macOS, Linux.\n          <\u002Fdiv>\n          <div class=\"project-tags\">\n            <span class=\"project-tag\">C++17<\u002Fspan>\n            <span class=\"project-tag\">Dear ImGui<\u002Fspan>\n            <span class=\"project-tag\">SDL3<\u002Fspan>\n            <span class=\"project-tag\">22 features<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"project-arrow\">\n          <span>May 2026<\u002Fspan>\n          <span class=\"arrow\">→<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n\n      <!-- UEVR Frontend -->\n      <a href=\"UEVR-Frontend-Dashboard.html\" class=\"project-card\">\n        <div class=\"project-thumb\">\n          <div class=\"project-thumb-placeholder\" style=\"display:flex;\">\n            <svg class=\"thumb-icon\" viewBox=\"0 0 48 48\" fill=\"none\">\n              <path d=\"M6 12 L24 6 L42 12 L42 34 L24 42 L6 34 Z\" stroke=\"#56d8ff\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath>\n              <path d=\"M15 17 L24 13 L33 17 L33 30 L24 35 L15 30 Z\" stroke=\"#56d8ff\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"><\u002Fpath>\n              <circle cx=\"24\" cy=\"24\" r=\"3\" fill=\"#56d8ff\"><\u002Fcircle>\n            <\u002Fsvg>\n            <span class=\"project-thumb-label\">UEVR Frontend<\u002Fspan>\n          <\u002Fdiv>\n          <span class=\"project-status-bar live\">Shipped<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"project-body\">\n          <div class=\"project-eyebrow\">C# · WPF · WinAPI · VR Tooling<\u002Fdiv>\n          <div class=\"project-title\">UEVR Frontend<\u002Fdiv>\n          <div class=\"project-blurb\">\n            System-tray VR injector desktop app — runs silently like Steam,\n            auto-detects Unreal Engine game launches via WMI, manages per-game profiles,\n            handles GitHub nightly auto-updates, and fixes anticheat issues with unelevated launchers.\n            Custom WinAPI tray from scratch.\n          <\u002Fdiv>\n          <div class=\"project-tags\">\n            <span class=\"project-tag\">C# / .NET 6<\u002Fspan>\n            <span class=\"project-tag\">WPF<\u002Fspan>\n            <span class=\"project-tag\">WinAPI<\u002Fspan>\n            <span class=\"project-tag\">20 features<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"project-arrow\">\n          <span>2025–2026<\u002Fspan>\n          <span class=\"arrow\">→<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n\n      <!-- UEVR luavrlib -->\n      <a href=\"https://claude.ai/design/p/bab2c03b-017e-47c7-a275-ca06aed7c289?file=index.html\" class=\"project-card\" target=\"_blank\" rel=\"noopener\">\n        <div class=\"project-thumb\">\n          <div class=\"project-thumb-placeholder\" style=\"display:flex;\">\n            <svg class=\"thumb-icon\" viewBox=\"0 0 48 48\" fill=\"none\">\n              <rect x=\"8\" y=\"8\" width=\"32\" height=\"32\" rx=\"4\" stroke=\"#9d8bff\" stroke-width=\"2.5\" fill=\"none\"><\u002Frect>\n              <path d=\"M16 18 L22 24 L16 30\" stroke=\"#9d8bff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n              <line x1=\"24\" y1=\"30\" x2=\"32\" y2=\"30\" stroke=\"#9d8bff\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline>\n            <\u002Fsvg>\n            <span class=\"project-thumb-label\">UEVR · luavrlib<\u002Fspan>\n          <\u002Fdiv>\n          <span class=\"project-status-bar active\">Active sprint<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"project-body\">\n          <div class=\"project-eyebrow\">C++20 · Lua / Sol2 · Unreal Engine · Dear ImGui<\u002Fdiv>\n          <div class=\"project-title\">UEVR · luavrlib<\u002Fdiv>\n          <div class=\"project-blurb\">\n            Extended UEVR's Lua scripting surface for VR modders — fast-path actor accessors\n            (3–5× faster), multistate worker threads, fixed TArray read paths, rewrote GLM bindings,\n            and built a live function caller UI with drag-and-drop in UObjectHook.\n          <\u002Fdiv>\n          <div class=\"project-tags\">\n            <span class=\"project-tag\">C++20<\u002Fspan>\n            <span class=\"project-tag\">Lua / Sol2<\u002Fspan>\n            <span class=\"project-tag\">Dear ImGui<\u002Fspan>\n            <span class=\"project-tag\">24 features<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"project-arrow\">\n          <span>Apr – May 2026<\u002Fspan>\n          <span class=\"arrow\">→<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── § 02 AI-augmented workflow ── -->\n  <section>\n    <div class=\"sec-head\">\n      <span class=\"sec-num\">§ 02<\u002Fspan>\n      <h2 class=\"sec-title\">AI-augmented engineering<\u002Fh2>\n      <div class=\"sec-rule\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"ai-section\">\n      <div class=\"ai-section-head\">\n        <div>\n          <div class=\"ai-section-title\">\n            Using Claude Code as a <span class=\"ai-highlight\">force multiplier<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ai-section-sub\">\n            Integrating AI into the development workflow isn't just a productivity trick — it's\n            become a core technical skill. The ability to scope, prompt, verify, and iterate with\n            AI agents is measurably changing what one engineer can ship per week. Every project\n            above was built or documented with Claude Code in the loop.\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"ai-badge\">Claude Code<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ai-grid\">\n        <div class=\"ai-card\">\n          <div class=\"ai-card-title\">Rapid codebase onboarding<\u002Fdiv>\n          <div class=\"ai-card-body\">\n            Explored ~100k-line codebases (UEVR, ImGuiColorTextEdit, ObjectTalk) in minutes rather than days.\n            Used Claude to map call graphs, identify integration points, and understand\n            undocumented APIs before writing a single line.\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ai-card\">\n          <div class=\"ai-card-title\">Boilerplate compression<\u002Fdiv>\n          <div class=\"ai-card-body\">\n            WPF/XAML bindings, CMake configuration, NOTIFYICONDATA structs, GitHub API\n            deserialization — the mechanical parts of C# and build systems that slow down\n            feature work are generated, reviewed, and wired in rather than hand-typed.\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ai-card\">\n          <div class=\"ai-card-title\">Progress dashboards as deliverables<\u002Fdiv>\n          <div class=\"ai-card-body\">\n            Turned raw sprint notes and code diffs into interactive portfolio dashboards —\n            kanban boards, dependency graphs, file heatmaps, and public-facing overviews —\n            entirely with AI tooling. These pages are themselves proof of the workflow.\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ai-card\">\n          <div class=\"ai-card-title\">Verification loop<\u002Fdiv>\n          <div class=\"ai-card-body\">\n            Senior developers know AI output needs review. Every generated function is\n            read, tested, and integrated with the same scrutiny as any PR — the speed\n            gain is in the first draft and iteration cycle, not in blind trust.\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ai-card\">\n          <div class=\"ai-card-title\">Multi-agent tooling<\u002Fdiv>\n          <div class=\"ai-card-body\">\n            Built Claude-powered tools directly into the dashboards — AI-assisted status\n            reports, release note drafters, data sync utilities, and a local companion\n            server that bridges browser UIs to the Claude CLI for in-context code review.\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ai-card\">\n          <div class=\"ai-card-title\">Output: 22 + 20 + 24 features shipped<\u002Fdiv>\n          <div class=\"ai-card-body\">\n            Across three projects in a single quarter, AI tooling was in the loop for\n            scoping, documentation, and boilerplate on every feature. The architecture,\n            design decisions, and integration work remained fully human.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── § 03 Merged contributions ── -->\n  <section>\n    <div class=\"sec-head\">\n      <span class=\"sec-num\">§ 03<\u002Fspan>\n      <h2 class=\"sec-title\">Merged contributions<\u002Fh2>\n      <div class=\"sec-rule\"><\u002Fdiv>\n      <span class=\"sec-sub\">upstream repos<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"contribs\">\n\n      <div class=\"contrib-card\">\n        <span class=\"contrib-status\">Merged to master<\u002Fspan>\n        <div class=\"contrib-title\">Unreal Lua Library<\u002Fdiv>\n        <div class=\"contrib-repo\">lobotomy-x/Unreal-Lua-Library<\u002Fdiv>\n        <div class=\"contrib-blurb\">\n          Companion Lua library extending UEVR's scripting surface. Actor utilities,\n          component helpers, math wrappers, and game-loop callbacks — maintained in\n          sync with the luavrlib backend. Used by the UEVR modding community.\n        <\u002Fdiv>\n        <div class=\"contrib-tags\">\n          <span class=\"contrib-tag\">Lua<\u002Fspan>\n          <span class=\"contrib-tag\">UEVR<\u002Fspan>\n          <span class=\"contrib-tag\">Unreal Engine<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"contrib-card\">\n        <span class=\"contrib-status\">Merged to master<\u002Fspan>\n        <div class=\"contrib-title\">ReShade integration<\u002Fdiv>\n        <div class=\"contrib-repo\">crosire/reshade<\u002Fdiv>\n        <div class=\"contrib-blurb\">\n          Contributed changes to ReShade's post-process injection pipeline.\n          Patches landed in the master branch and are included in the\n          standard ReShade distribution used by millions of players.\n        <\u002Fdiv>\n        <div class=\"contrib-tags\">\n          <span class=\"contrib-tag\">C++<\u002Fspan>\n          <span class=\"contrib-tag\">DirectX<\u002Fspan>\n          <span class=\"contrib-tag\">Graphics<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"contrib-card\">\n        <span class=\"contrib-status\">Merged to master<\u002Fspan>\n        <div class=\"contrib-title\">VRM Addon for Blender<\u002Fdiv>\n        <div class=\"contrib-repo\">saturday06/VRM-Addon-for-Blender<\u002Fdiv>\n        <div class=\"contrib-blurb\">\n          Contributed bug fixes and feature work to the most-used VRM import/export\n          Blender addon. Changes merged into the main branch and shipped to users\n          via the Blender Extensions platform.\n        <\u002Fdiv>\n        <div class=\"contrib-tags\">\n          <span class=\"contrib-tag\">Python<\u002Fspan>\n          <span class=\"contrib-tag\">Blender<\u002Fspan>\n          <span class=\"contrib-tag\">VRM / glTF<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"contrib-card\">\n        <span class=\"contrib-status\">Merged to master<\u002Fspan>\n        <div class=\"contrib-title\">Dumper-7 SDK tooling<\u002Fdiv>\n        <div class=\"contrib-repo\">UE4SS-RE/Dumper-7<\u002Fdiv>\n        <div class=\"contrib-blurb\">\n          Contributed to Dumper-7, the community-standard Unreal Engine SDK generator\n          used for game reverse engineering. Changes landed in master and are used by\n          modders across dozens of UE4/UE5 titles.\n        <\u002Fdiv>\n        <div class=\"contrib-tags\">\n          <span class=\"contrib-tag\">C++<\u002Fspan>\n          <span class=\"contrib-tag\">Unreal Engine<\u002Fspan>\n          <span class=\"contrib-tag\">Reverse engineering<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <a href=\"https://github.com/lobotomy-x/UEVR/tree/luavrlib/docs\" class=\"contrib-card\" target=\"_blank\" rel=\"noopener\">\n        <span class=\"contrib-status\">Published<\u002Fspan>\n        <div class=\"contrib-title\">UEVR luavrlib docs<\u002Fdiv>\n        <div class=\"contrib-repo\">lobotomy-x/UEVR · docs/<\u002Fdiv>\n        <div class=\"contrib-blurb\">\n          API reference and usage docs for the luavrlib scripting surface.\n          Covers the api_fast namespace, worker threads, GLM bindings,\n          UObjectHook extensions, and function call editor.\n        <\u002Fdiv>\n        <div class=\"contrib-tags\">\n          <span class=\"contrib-tag\">Documentation<\u002Fspan>\n          <span class=\"contrib-tag\">Lua<\u002Fspan>\n          <span class=\"contrib-tag\">UEVR<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"https://github.com/lobotomy-x\" class=\"contrib-card\" target=\"_blank\" rel=\"noopener\">\n        <span class=\"contrib-status\">Public<\u002Fspan>\n        <div class=\"contrib-title\">More on GitHub<\u002Fdiv>\n        <div class=\"contrib-repo\">github.com/lobotomy-x<\u002Fdiv>\n        <div class=\"contrib-blurb\">\n          Additional open-source work, experiments, and tooling available\n          on GitHub — including prototypes, utilities, and contributions\n          to the broader game modding and VR community.\n        <\u002Fdiv>\n        <div class=\"contrib-tags\">\n          <span class=\"contrib-tag\">Open source<\u002Fspan>\n          <span class=\"contrib-tag\">GitHub<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer>\n    <span>Logan Brunet · Portfolio · 2026<\u002Fspan>\n    <span>loganwbrunet@gmail.com<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
