<script>
const DOCS = [{"id":"overview","title":"Overview","group":"About","md":"### UEVR Lua Library \nThis is unlikely to be released as a polished mod. UEVR script writers should study as much of the Dev folder as possible with the understanding that dependency management has been excluded. If you are going to give any training data to an AI, give it this library.\n\nBelow are direct links to notable written guides. You should also view the changes in my forked uevr-docs repo\nhttps://github.com/lobotomy-x/uevr-docs/blob/main/src/plugins/lua\n\n### Dynamic UFUNCTION Out Param Handling \nhttps://github.com/lobotomy-x/Unreal-Lua-Library/blob/main/Docs/UEVR/Automatic%20Out%20Parameters.md\n\n### Spawn Dev Console in Shipping Build\n\n```lua\nlocal pc \nlocal console_spawned = false\nlocal function spawn_console()\n    pc = pc or api:get_player_controller(0)\n    if pc then\n        local pc_player_ref = pc.Player\n            if not pc_player_ref then\n                local props = pc:get_class():get_child_properties()\n                while props ~= nil do\n                    -- probably only necessary because MHUR devs want to be different and named their player ref PLAYER\n                    if props and props.get_fname and props:get_fname():to_string():lower() == \"player\" then\n                        pc_player_ref = pc[props:get_fname():to_string()]\n                        if pc_player_ref ~= nil then break end\n                    end\n                end\n            end\n            local _viewport\n            if pc_player_ref then\n                _viewport = pc_player_ref.ViewportClient\n            else\n                _viewport = uevr.api:find_uobject(\"Class /Script/Engine.GameViewportClient\"):get_first_object_matching(false)\n            end\n\n            if _viewport and _viewport.ViewportConsole == nil then\n                   local console_class = uevr.api:find_uobject(\"Class /Script/Engine.Console\")\n\n             local temp = uevr.api:spawn_object(console_class, _viewport)\n               _viewport.ViewportConsole = temp\n               if _viewport.ViewportConsole ~= nil then\n                    console_spawned = true\n                    print(\"Console spawned, activate with ~\")\n               end\n            end\n        end\nend\nspawn_console()\n\n\n```\n\n### Lua For Normal Programmers\nhttps://github.com/lobotomy-x/Unreal-Lua-Library/blob/main/Docs/UEVR/Lua%20For%20Normal%20Programmers.md\n\n### Optimizing Lua Tables\nhttps://github.com/lobotomy-x/Unreal-Lua-Library/blob/main/Docs/UEVR/LuaTablesBreakdown.md\n\n### Lua Metatables and Usertype Extensions\nhttps://github.com/lobotomy-x/Unreal-Lua-Library/blob/main/Docs/UEVR/ExtendingLuaTypes.md\n\n### Pure Lua Extensions for GLM Math Types\nhttps://github.com/lobotomy-x/Unreal-Lua-Library/blob/main/Docs/UEVR/Extending%20GLM.md\n\n### Styling UEVR Main GUI\nhttps://github.com/lobotomy-x/Unreal-Lua-Library/blob/main/Docs/UEVR/Styling%20the%20UEVR%20Main%20GUI%20from%20Lua.md\n"},{"id":"lua-primer","title":"Lua for Normal Programmers","group":"Guides","md":"## Quick Comparison\n\n| C++ / HLSL / etc.                     |  Lua               |  Python            |\n| :---                                  |       ---          |               ---: |\n|`!=`                                   |  `~=`              |      `!=`          |\n|`nullptr`                              |  `nil`             |      `None`        |\n| `for (i = 0; i <= T.size() - 1; ++i)` |  `for i = 1, #T do`|   `for i in t:`    |\n| Ternary Operator                      |                    |                    |\n|`a = b ? c : d`                        | `a = b and c or d` | `a = c if b else d`|\n| Static functions                      |                    |                    |\n| `Namespace::Klass::Func()`            | `object.func()`    |`Class.func()`      | \n| Members                               |                    |                    |\n| `this.Func()`                         | `self:func()`      |`self.func()`       | \n| Casting                               |                    |                    |\n| `(Type)(object)`                      | Not possible       |`obj = Type(object)`|\n| Whitespace                            |                    |                    |\n| Doesn't matter except for macros      | Never matters      | Critical           |\n\n\n### Strings\nStrings are really weird in lua! Everything is a string, everything can be a string, you can write your entire program as a string and then load it as a chunk, but you can't modify a string ever. Wait but I thought we can concatetanate with `..`\nWell yes but actually no. You're still not modifying anything, all you're doing is allocating a new string object and copying the data from the other two. In fact, a `string` object in lua is really just a pointer (everything in lua is tbh) to the address of a constant array of characters. You actually cannot make a string function to modify in place without some proxy string table \n\n### Correct Error Handling\n`pcall` and `xpcall` can be used to avoid errors but not many UEVR modders seem to understand the usage fully and don't take any of the values returned by `pcall`. These contain the result and either the error message if it failed or the value returned by the inner function if it succeeded\n```lua\nlocal riskyvalue\nlocal success, result = pcall(function()\n  return riskyfunc()\nend)\nif not success then print(result)\nelse riskyvalue = result\nend\n\n```\nI usually just abbreviate to `local s,r = pcall()`\n\n### Declaring locals\nLocal variables should be used as much as possible. There's some oddities however. First of all you may have seen lua code that looks like this\n```lua\nlocal var\nlocal function do_something()\n    var = var or get_value()\nend\ndo_something()\n```\nThis is fairly simple, var gets declared with `nil` value and if its `nil` when we run the function it gets set. On subsequent runs it will already be set and nothing happens. The important part here I'm showing is the declaration. This is my recommended way of declaring named variable without default values. Do not assign local variables to `nil` that is pointless.\n\nPlease be aware this cannot be used for globals at all. The code below would throw an error\n```lua\nvar\nlocal function do_something()\n    var = var or get_value()\nend\ndo_something()\n```\nThere is no way to programmatically create new locals but you can use the following code to prevent declaring real globals and make it so global declarations create variables in a limited scope, very similar to locals\n\n```lua\nlocal _ENV = setmetatable({}, {__index=_G,__newindex=rawset})\n```\n\n### Conditional Assignment Tricks\nYou can iterate down nested tables like so\n```lua\n  local function func(a, b, c, t)\n    t = t or {}\n    t[b] = t[b] or {}\n    t[b][c] = t[b][c] or a\n  end\n```\nNote that in that case you will get persistent storage even if t is nil but you won't be able to retrieve the values without a reference to the table created in the first line.\n\n\n### Ternary operator\n\nIn most sane languages we can combine if else statements into a single conditional expression with the `a ? b : c` or `if a then b else c`. This is really nice especially in C languages where using it inline helps reduce verbosity. In HLSL (but not GLSL) shader programming it actually compiles to fewer instructions and is an important optimization feature. Outside of that usecase its just syntactic sugar but its a nice thing to have and something you may be missing in lua if like me you just jumped in thinking it looks enough like python to get by. As briefly shown above you can do the same thing in lua \n\nThis is what I was doing before I found out\n```lua\nlocal id = \"\"\nif type(text) == \"string\" then\n  id = text:sub(1, math.min(#text, 25)) else\n  id = text\n end\n```\nHere's the same functionality using the trick\n```lua\nlocal id = type(text) == \"string\" and text:sub(1, math.min(#text, 25)) or text\n```\nThis is obviously way better since it reduces line count without harming readability and combines declaration and conditional assignment into one step. I use this technique quite often but sometimes you should just stick with `if then else end`\n\nIf you are doing anything with multiple steps please make use of parentheses and indents to improve readability and gate logic. Parentheses are never required for conditionals but they are always parsed so use them correctly\n\nYou could technically force anything to be assignable like this by using an anonymous function e.g.\n```lua\na = a and b or (function() return c)() \n```\nIn this case you would be better off just using if then else.\n\n\n### Conditional evaluation order\n\nLua uses short circuit evaluation so you can use increasingly specific conditionals like so\n```lua\n    if pc and pc.Character and pc.Character.Mesh and pc.Character.Mesh ~= active_mesh then\n        active_mesh = pc.Character.Mesh\n    end\n```\n\n### \"Attempt to index a boolean value\"\n\nThis is a very common error that can happen for a number of reasons and will vary by case. One possibility is that you tried to require a module that doesn't have a return statement and accessed something from it\nIt can also happen if you use implicit `nil` checks e.g. `if not a then b end`  \n\n\n### multireturn/multiassignment\nif you've looked at the imgui api you must know that multireturn is a thing since most imgui functions make use of it. Its pretty intuitive and worth using sometimes, although its realistically no different than returning a table. If you want to discard a returned value that isn't at the end of the list just use _\n\n\nHere's an example of multiassignment\n```lua\n  local world, game_engine, viewport, pc, pawn, game_engine_class, level, game_instance,\n  melee_weapon, melee_weapon_mesh, gun_mesh, last_weapon, using_weapon, gun, widgets,\n  suit_mesh, mesh, mychar, abp, poseable_mesh,\n  fp_spring_arm, fp_cam_actor, first_person_cam,\n  tp_spring_arm, tp_cam_actor, tp_cam_comp,\n  cinematic_camera, free_cam, game_zoom, game_spring, game_cam_comp = nil\n  local is_fp, wants_fp, centered = false\n  local accessory_meshes, hidden_bones, morph_targets, address_cache = {}\n```\n\nThe first set of variables is absolutely fine but if you try to use this code you'll likely come up with some errors. Can you guess why?\n\nThis is a trap that you can easily fall into if you're learning only from examples and testing only by running your scripts ingame. So as convenient as it would be if we could just set everything to the same value, unfortunately the first part only works because everything after \"world\" gets set to nil automatically. This is also the case for \"wants_fp\", \"centered\", \"hidden_bones\", \"morph_targets\", and \"address_cache\" so if you tried to add things to an empty table or set a bool to not itself you'd be trying to use a nil value\n\n```lua\nlocal is_fp, wants_fp, centered = false, false, false\nlocal accessory_meshes, hidden_bones, morph_targets, address_cache = {}, {}, {}, {}\n```\n### Named/Order Independent Parameters\n\nA nice feature of some \"real\" programming languages (and python) is the ability to define named arguments. This is another case similar to the ternary where lua has an alternative that kind of just works but isn't an actual built in feature. It requires slightly more work in both defining and calling the function but has the benefit that unlike other programming languages that typically require named arguments to come in a specific order you can use these freely. You can do this by defining a single parameter that you expect to be a table\n\n```lua\nfunction CreateTreeNode(args)\n    if not args or type(args) ~= \"table\" then return end\n    local label = args.label or \"Node Data\"\n    local keys = args.keys or args.data.__orderedIndex\n    local parents = args.parents or nil\n    local data = args.data\n    local widget = args.widget or nil\n    local widget_default_args = args.widget_default_args or nil\n    local root_key = args.root_key or \"None\"\n\n```\n\n### Automatic Type Conversion\n\nLua provides this feature in a somewhat inconsistent way that can only be rationalized by remembering that lua originated as a configuration langauge written by mathematicians. Arithmetic operations and string concatenation therefore are available without actually neeeding to write tostring and tonumber\n\n```lua\nstr = \"1.0\"\nprint(str + 2.5)    -- 3.5\nprint(str .. 2.5)   -- 1.02.5\n```\nHowever the same rule does not apply to strings and tables.\n"},{"id":"lua-tables","title":"Optimizing Lua Tables","group":"Guides","md":"## Tables, Arrays, Sequences\nTables are the core data structure of Lua. *Array* and *Sequence* are both terms used to describe numerically indexed lua tables\ne.g. \n```lua\narr = {\"a\", \"b\", \"c\"}\nprint(arr[1])\n-- > a\n```\nUnlike other programming languages tables go from 1 to the length of the table instead of starting at 0. You can get the length of an array with `#` or with the *metamethod* `__len` \ne.g. \n```lua\nprint(#arr)\n-- > 3\n```\nLua tables can also use key value pairs and while anything can technically be a key you generally will use strings. Key-value-pair tables must be iterated with `pairs` which does not respect order. They are needed for storage and can be used for max speed accessing with a lookup table. To get around the ordering issue you should have another table to track the index. This can be hidden in a convenient way. You should use my orderedPairs implementation to simplify all of this\n\nArrays are the optimal type of lua table as they can be iterated in order with `ipairs` or direct numeric indexing, e.g.\n```lua\nfor i = 1, #t do\n  local value = t[i]\nend\n```\n\n## Colon Syntax\nUnlike other lua types you cannot call any of the table functions on a table with colon syntax by default. This is because every table created with the `{}` operator has its own unique metatable for unclear reasons. To achieve behavior similar to other lua types and usertypes you can manually set the metatable to a proxy that points to `table`\n\n```lua\nlocal tablemt = {__index = table}\nfunction T(t)\n\treturn setmetatable(t or {}, tablemt)\nend\n```\n\nWhen calling from `table` lua will automatically recognize the input table as a table. But when calling from the table object with a colon it will only work if the metatable is set ahead of time.\n\n```lua\n\tfunction table:extend(src)\n\t    return table.move(src, 1, #src, #self + 1, self)\n\tend\n```\nYou can still use this function from `table` even if the metatables have not been set for the input tables.\n```lua\n\ttable.extend({1,2}, {3,4})\n\t--{1,2,3,4}\n```\n\n`setmetatable` does return the input table so you can use it directly like so if you prefer to write this inline. \n```lua\n\tsetmetatable({1,2}, {__index = table}):extend({3,4})\n```\n\nThis syntax works too\n```lua\n\tprint(setmetatable({1,2}, {__index = table}):extend({3,4})[3])\n```\n\n\n```lua\nfunction table:merge(src)\n    for k, v in pairs(src) do\n        self[k] = v\n    end\n    return self\nend\n\nfunction table:contains(element)\n    if self == nil then\n        return false\n    end\n\n    for _, value in pairs(self) do\n        if value == element then\n            return true\n        end\n    end\n    return false\nend\n\nfunction table:empty()\n    return (not self or not next(self)) and true or false\nend\n```\n### Adding Elements\n\nYou can call table.insert(t, element) to add an item to the end of the table or table.insert(t, element, i) to insert at position i\n```lua\nlocal x  = {1,2,3}\ntable.insert(x, 1, 4)\nprint(x[1])\n--> 4 \n```\nFor insertions at the end you should ignore table.insert and instead use `_table[#_table+1] = newval`. Don't overthink it, its just a little bit faster and is honestly quicker to type than table.insert\n```lua\nlocal x = {1, 2, 3}\nx[#x+1] = 4\nprint(x[4])\n--> 4\n```\n\n### Removing Elements\nFor arrays you must iterate in reverse or removing elements will break things\n```lua\nfor i = #t, 1, -1 do\n  local v = t[i]\n  if not is_good(v) then\n    table.remove(t, i)\n  end\nend\n```\nFor other tables you can just set values to nil if you're not trying to use the elements in the table\n```lua\nfunction wipe_table(t)\n\twhile true do\n\t\tlocal k = next(t)\n\t\tif not k then break end\n\t\tt[k] = nil\n\tend\nend\n```\n\n\n## Metatables\nThese provide class-like features in lua and allow objects to act like different types. `__index` pretends an object is a table\n\n**Accessing Container Elements**\nThe information specifically regarding accessing elements applies to all tables as well as any object that has been assigned a metatable with an `__index` function assigned. e.g. you can use `vec[\"x\"]` on a `Vector3f` \n \n```lua\nlocal table1 = {\n    \"entry1\", \"entry2\"\n}\n```\nthis is perfectly valid, entry1 and entry2 are string entries\n```lua\nlocal table1 = {\n    entry1, entry2\n}\n```\nthis is probably not valid. entry1 and entry2 are pointers to variables, so if they don't exist you've attempted to index a nil value\n```lua\nlocal table1 = {\n    entry1 = \"entry2\", entry3 = {\n        \"entry4\", \"entry5\"\n    }\n}\n```\nnow entry1 is completely valid since we are assigning the value in the same step. You can access it with table1.entry1, but since we assigned a value to it that means its also a string index so we can access it with table1[\"entry1\"]\nThat may seem redundant so let's look at a couple more examples.\n\nthis is absolutely not valid due to the whitespace\n\n```lua\nlocal table1 = {\n    entry 1 = \"entry2\"\n}\n```\n\nthis is valid. You can access it with table1[\"entry 1\"] but not with dot notation\n```lua\nlocal table1 = {\n    \"entry 1\" = \"entry2\"\n}\n```\n\n## Ordered Pairs\n\nLua tables only retain order when using numerical indexing. Therefore using `pairs` to iterate string keys will not preserve order. \n\n\n```lua\n\nfunction __genOrderedIndex(t)\n  local orderedIndex = t.__orderedIndex or setmetatable({},{__index = table})\n  t.__keys = t.__keys or setmetatable({},{__index = table})\n  t.__lookup = t.__lookup or setmetatable({},{__index = table})\n    -- ensure correct sorting for rotator to Vector3 handling\n  -- idk why its like this but it is\n  if #t == 3 and (t.pitch or t.Pitch) then\n    return {\"Pitch\", \"Yaw\", \"Roll\"}\n  end\n  for key in pairs(t) do\n      orderedIndex[#orderedIndex+1] =  type(key) == \"string\" and key or tostring(key)\n        t.__lookup[t[key]] = key\n  end\n  orderedIndex:sort()\n\n  return orderedIndex\nend\n\n\nfunction find_ordered_key(tbl, key)\n  local index = tbl.__keys and tbl.__keys[key]\n  return index or nil\nend\n\n\nfunction ordered_lookup(tbl, value)\n  local key = tbl.__lookup and tbl.__lookup[value]\n  return key or nil\nend\n\n\n\n-- pairs does not maintain order. maybe you heard this and like me thought it was no big deal and only matters for storage\n-- but its actually borderline unusable. we are fixing that\n-- normally this will generate a hidden table with the ordered index based on alphabetical order\n-- but you can instead provide a table with the correct order in the orderedPairs function\n-- this is crucial for dynamic param-building functions like BreakhitResult which requires empty table values with string keys\nfunction orderedNext(t, state)\n  if not t then return end\n\n    t.__lookup = t.__lookup or setmetatable({},{__index = table})\n  local key = (t.__ordered_index ~= nil and state == nil) and t.__ordered_index[1] or nil\n  --print(\"orderedNext: state = \"..tostring(state) )\n  if state == nil and t.__ordered_index == nil then\n    -- the first time, generate the index\n    t.__ordered_index = t.__orderedIndex or __genOrderedIndex(t)\n      if not t.__keys then t.__keys = {}\n        for i = 1, #t.__ordered_index do\n                t.__keys[t.__ordered_index[i]] = i\n            end\n        end\n    key = t.__ordered_index[1]\n\n  else\n    -- fetch the next value\n    for i = 1, #t.__ordered_index do\n      if t.__ordered_index[i] == state then\n        key = t.__ordered_index[i + 1]\n      end\n    end\n  end\n\n  if key and key ~= \"__lookup\" and key ~= \"__keys\" then\n      if t[key] then\n        t.__lookup[t[key]] = key\n      end\n    return key, t[key]\n  end\n    t.ordered_index = nil\n  return\nend\n\n\n-- this is how you actually iterate an ordered table\n-- if no orderedIndex exists yet we construct it on the first try\n-- if this is an array we just call ipairs so everything works as expected\n-- you can prebuild your orderedIndex, directly assign it, or pass it here\n-- if you want to you can override pairs with orderedPairs in a local variable in your own script\nfunction orderedPairs(t, orderedIndex)\n    t = T(t)\n    if is_array(t) then\n     return ipairs(t)\n    end\n    if orderedIndex ~= nil then\n    t.__orderedIndex = orderedIndex\n    end\n  return orderedNext, t, nil\nend\n\n-- basically python zip\n-- takes two arrays already in correct order and splices them into an orderedTable\nfunction build_ordered_table(keys, values)\n  local t = {}\n  t.__lookup = {}\n  assert(is_array(keys) and is_array(values))\n  for i = 1, #keys do\n    t[keys[i]] = values[i]\n    t.__keys[keys[i]] = i\n    t.__lookup[values[i]] = keys[i]\n  end\n  t.__orderedIndex = keys\n  return t\nend\n\n-- this is what I use most of the time\n-- very straight forward and simple to use\nfunction ordered_insert(tbl, new_key, new_value)\n  tbl.__orderedIndex = tbl.__orderedIndex or setmetatable({},{__index = table})\n  tbl.__lookup = tbl.__lookup or setmetatable({},{__index = table})\n  tbl.__keys = tbl.__keys or setmetatable({},{__index = table})\n  local t = tbl.__orderedIndex\n  -- only update insertion order if its new\n  if tbl[new_key] == nil then\n    t[#t+1] = new_key\n    tbl.__keys[new_key] = #t\n  end\n  tbl[new_key] = new_value\n  tbl.__lookup[new_value] = new_key\n  return tbl\nend\n\n\n```\n"},{"id":"usertypes","title":"Metatables & Usertype Extensions","group":"Guides","md":"## Extending metatables\nYou may have seen or made modules for lua with the typical style like so \n```lua\nlocal M = {}\nfunction M.some_function()\n  blahblahblah()\nend\nlocal function some_local_function()\n  blahblahblah()\nend\nlocal x = 1\nreturn M\n```\n\n## Overriding/monkeypatching Global Functions\nYou can easily do this by simply assigning a local variable to the original function and then replacing with your own code\n\nThe code below patches all the draw api functions to accept colors as UE structs, Vector4f, or U32 \n```lua\nlocal function vec_to_u32(vec)\n    local r = floor(max(0, min(255, vec.x * 255 + 0.5)))\n    local g = floor(max(0, min(255, vec.y * 255 + 0.5)))\n    local b = floor(max(0, min(255, vec.z * 255 + 0.5)))\n    local a = floor(max(0, min(255, vec.w * 255 + 0.5)))\n    return (a << 24) | (b << 16) | (g << 8) | r\nend\n\nlocal prev_uint = 0\nlocal vec = nil\nlocal function u32_to_v(color)\n    if prev_uint ~= nil and prev_uint == color and vec ~= nil then\n        return vec\n    end\n    prev_uint = color\n    local r = color & 0xFF\n    local g = (color >> 8) & 0xFF\n    local b = (color >> 16) & 0xFF\n    local a = (color >> 24) & 0xFF\n\n    col = {\n        r / 255.0,\n        g / 255.0,\n        b / 255.0,\n        a / 255.0,\n    }\n    vec = Vector4f.new(r, g, b, a)\n    return vec\nend\n\nlocal function fcolor_to_v4(t)\n    local v\n    if type(t) == \"table\" and #t == 4 then\n        v = Vector4f.new(table.unpack(t))\n     elseif t.R then v = Vector4f.new(t.R, t.G, t.B, t.A)\n    end\n    return (v * (1 / 255.0))\nend\n\nlocal function coerce_color_type(color)\n    return (type(color) == \"number\" and color)\n        or (color.x ~= nil and vec_to_u32(color))\n        or (type(color) == \"table\" and vec_to_u32( fcolor_to_v4(color)))\nend\n\nlocal old_draw = {}\nfor k, v in pairs(draw) do\n    old_draw[k] = v\nend\n\nfunction draw.outline_circle( x,  y,  radius, color, num_segments)\n\n    old_draw.outline_circle( x,  y,  radius, coerce_color_type(color), num_segments)\nend\nfunction draw.filled_circle( x,  y,  radius, color, num_segments)\n\n    old_draw.filled_circle( x,  y,  radius, coerce_color_type(color), num_segments)\nend\nfunction draw.outline_quad( x1,  y1,  x2,  y2,  x3,  y3,  x4,  y4, color)\n\n    old_draw.outline_quad( x1,  y1,  x2,  y2,  x3,  y3,  x4,  y4, coerce_color_type(color))\nend\nfunction draw.filled_quad( x1,  y1,  x2,  y2,  x3,  y3,  x4,  y4, color)\n\n    old_draw.filled_quad( x1,  y1,  x2,  y2,  x3,  y3,  x4,  y4, coerce_color_type(color))\nend\n\n```\n\n## \"Polluting\" Global Tables\nYou may have heard not to do this and AI tends to warn against it. There are reasons for that but many do not apply to UEVR with its singular shared state. If you haven't heard or thought of this concept you may be surprised by this. Even if you were aware its possibly with lua types you may not have considered it can be done with usertypes. \n\n```lua\n\nVector3 = UE5 and Vector3d or Vector3f\nVector4 = UE5 and Vector4d or Vector4f\nVector2 = UE5 and Vector2d or Vector2f\n\nQuat = UE5 and Quaterniond or Quaternionf\n\nfunction UEVR_UObject:is_actor()\n    return self.K2_GetActorLocation ~= nil and self\nend\nfunction UEVR_UObject:as_actor()\n    return (self:is_actor() and self) or self:get_outer()\nend\nfunction UEVR_UObject:is_component()\n    -- return self:is_child_class_of(ActorComponentClass)\n    return self.GetComponentTickInterval ~= nil\nend\n\nfunction UEVR_UObject:is_scene_component()\n    -- return self:is_class_child_of(SceneComponentClass)\n    return self.K2_GetComponentToWorld ~= nil\nend\nfunction UEVR_UObject:as_component()\n    if self:is_component() then return self\n    else return (self.RootComponent or self.CapsuleComponent)\n    end\nend\nfunction UEVR_UObject:add_component(uclass, offset)\n    offset = offset or Vector3.new(0,0,0)\n local t = api:add_component_by_class(\n        (self:is_actor() and self) or self:get_outer(),\n        type(uclass) == \"string\" and Cache.get((uclass:endswith(\"Component\") and uclass or uclass..\"Component\")) or uclass,\n        false\n    )\n    if not t then print(inspect({uclass, self, \"failed to add component\"})) end\n    t.RelativeLocation = offset\n    return t\nend\n```\nI wrote an entire massive script API using this concept! It will be available one day if I dont just reimplement it all in C++\n\n## Loading string chunks to extend tables modularly\n\n```lua\nlocal kismet_libs = {\nMaterial =  \"Class /Script/Engine.KismetMaterialLibrary\",\nMath =      \"Class /Script/Engine.KismetMathLibrary\",\nRendering = \"Class /Script/Engine.KismetRenderingLibrary\",\nSystem = \"Class /Script/Engine.KismetSystemLibrary\",\nString = \"Class /Script/Engine.KismetStringLibrary\",\n}\nkismet_cache = {}\nKismet = setmetatable({}, {\n            __call = function(_, lib)\n                kismet_cache[lib] = kismet_cache[lib] or\n                    (kismet_libs[lib] and\n                        (UEVR_UObjectHook.get_first_object_by_class(api:find_uobject(kismet_libs[lib]), true)\n                        or api:find_uobject(kismet_libs[lib]):get_class_default_object()))\n                return kismet_cache[lib]\n            end,\n            __index = function(_, lib)\n               kismet_cache[lib] = kismet_cache[lib] or\n                    (kismet_libs[lib] and\n                        (UEVR_UObjectHook.get_first_object_by_class(api:find_uobject(kismet_libs[lib]), true)\n                        or api:find_uobject(kismet_libs[lib]):get_class_default_object()))\n                return kismet_cache[lib]\n            end\n        })\n\n\n\n\nlocal kmc_chunk = [[\n\n    local KMC = {}\n    function KMC.kismet_LinearColor_Black()\n            return KM:LinearColor_Black()\n        end\n    function KMC.kismet_LinearColor_Blue()\n            return KM:LinearColor_Blue()\n        end\n    function KMC.kismet_LinearColor_Desaturated(InColor, InDesaturation)\n            return KM:LinearColor_Desaturated(InColor, InDesaturation)\n        end\n    function KMC.kismet_LinearColor_Distance(C1, C2)\n            return KM:LinearColor_Distance(C1, C2)\n        end\n    function KMC.kismet_LinearColor_GetLuminance(InColor)\n            return KM:LinearColor_GetLuminance(InColor)\n            end\n    function KMC.kismet_LinearColor_GetMax(InColor)\n            return KM:LinearColor_GetMax(InColor)\n        end\n    function KMC.kismet_LinearColor_GetMin(InColor)\n            return KM:LinearColor_GetMin(InColor)\n        end\n    function KMC.kismet_LinearColor_Gray()\n            return KM:LinearColor_Gray()\n        end\n    function KMC.kismet_LinearColor_Green()\n            return KM:LinearColor_Green()\n        end\n    function KMC.kismet_LinearColor_IsNearEqual(A, B, tolerance)\n            return KM:LinearColor_IsNearEqual(A, B, tolerance)\n        end\n    function KMC.kismet_LinearColor_Quantize(InColor)\n            return KM:LinearColor_Quantize(InColor)\n        end\n    function KMC.kismet_LinearColor_QuantizeRound(InColor)\n            return KM:LinearColor_QuantizeRound(InColor)\n        end\n    function KMC.kismet_LinearColor_Red()\n            return KM:LinearColor_Red()\n        end\n    function KMC.kismet_LinearColor_Set(InOutColor, InColor)\n          local OutColor = {}\n            KM:LinearColor_Set(OutColor, InColor)\n            InOutColor = OutColor.result\n            return InOutColor\n        end\n    function KMC.kismet_LinearColor_SetFromHSV( InOutColor, H, S, V,  A)\n         local OutColor = {}\n            KM:LinearColor_SetFromHSV(OutColor, H, S, V,  A)\n            InOutColor = OutColor.result\n            return InOutColor\n        end\n    function KMC.kismet_LinearColor_SetFromPow22(InOutColor, InColor)\n        local OutColor = {}\n            KM:LinearColor_SetFromPow22(OutColor, InColor)\n            InOutColor = OutColor.result\n            return InOutColor\n        end\n    function KMC.kismet_LinearColor_SetFromSRGB(InOutColor, InSRGB)\n      local OutColor = {}\n        KM:LinearColor_SetFromSRGB(OutColor, InSRGB)\n        InOutColor = OutColor.result\n\n        return InOutColor\n    end\n    function KMC.kismet_LinearColor_SetRandomHue(InOutColor)\n         local OutColor = {}\n           KM:LinearColor_SetRandomHue(OutColor)\n           InOutColor = OutColor.result\n        return InOutColor\n    end\n    function KMC.kismet_LinearColor_SetRGBA(InOutColor, R, G, B, A)\n            local OutColor = {}\n            KM:LinearColor_SetRGBA(OutColor, R, G, B, A)\n            InOutColor = OutColor.result\n            return InOutColor\n        end\n    function KMC.kismet_LinearColor_SetTemperature(InOutColor, InTemperature)\n      local OutColor = {}\n             KM:LinearColor_SetTemperature(OutColor, InTemperature)\n           InOutColor = OutColor.result\n            return InOutColor\n        end\n    function KMC.kismet_LinearColor_ToNewOpacity(InColor, InOpacity)\n            return KM:LinearColor_ToNewOpacity(InColor, InOpacity)\n           end\n    function KMC.kismet_LinearColor_ToRGBE(InLinearColor)\n            return KM:LinearColor_ToRGBE(InLinearColor)\n         end\n    function KMC.kismet_LinearColor_Transparent()\n            return KM:LinearColor_Transparent()\n        end\n    function KMC.kismet_LinearColor_White()\n            return KM:LinearColor_White()\n        end\n    function KMC.kismet_LinearColor_Yellow()\n            return KM:LinearColor_Yellow()\n        end\n    function KMC.kismet_LinearColorLerp(A, B, Alpha)\n            return KM:LinearColorLerp(A, B, Alpha)\n        end\n    function KMC.kismet_LinearColorLerpUsingHSV(A, B, Alpha)\n        return KM:LinearColorLerpUsingHSV( A, B, Alpha)\n    end\n    return KMC\n-- ]]\n\n-- Pass a custom environment to the chunk\n-- If you do this then you must define EVERYTHING that gets accessed, even print\nlocal function get_kmc_chunk(env)\n    local Kismet =  uevr.api:find_uobject(\"Class /Script/Engine.KismetMathLibrary\"):get_class_default_object()\n    local custom_env = {\n       UEVR_UObject = _G.UEVR_UObject,\n       uevr = uevr,\n       KM = Kismet,\n       print = print\n    }\n    local chunk, error = load(kmc_chunk, \"KMChunk\", \"t\", custom_env)\n    if error then print(error)\n    else return chunk() end\nend\n\nlocal function test_chunk_load()\n    local KMC = get_kmc_chunk()\n    if KMC then\n        local res = KMC.kismet_LinearColor_Red()\n        print(res.R)\n        local res2 = KMC.kismet_LinearColor_SetRGBA(res, 0.5, 1.0, 0.2, 1.0)\n        print(inspect(res2))\n    end\nend\n\nlocal function test_chunk_load2()\n    local KM = Kismet(\"Math\")\n    _ENV.KM = KM\n     local chunk, error = load(kmc_chunk)\n    local KMC = chunk()\n    if KMC then\n        local res = KMC.kismet_LinearColor_Red()\n        print(res.R)\n        local res2 = KMC.kismet_LinearColor_SetRGBA(res, 0.5, 1.0, 0.2, 1.0)\n        print(res2.R)\n        print(res2.G)\n        print(res2.B)\n        print(res.A)\n    end\nend\nprint(\"testing custom environment version\")\ntest_chunk_load()\n\nprint(\"testing global environment version\")\ntest_chunk_load2()\n\n```\nMore generic test\n```\n\n\n-- The original table\nlocal data = { a = 10, b = 20, ext = {} }\n\n-- The metatable\nlocal mt = {}\n    -- __index handles reading missing keys\n    mt.__index = function(table, key)\n        for _, ex in ipairs(table.ext) do\n            if type(ex) == \"table\" then\n                if ex[key] then \n                    return ex[key]\n                end\n            end\n        end\n        return 0\n        -- Return 0 for any missing key\n    end\n    -- -- __tostring customizes how the table is printed\n    mt.__tostring = function(table)\n        return \"Data: a=\" .. table.a .. \", b=\" .. table.b\n    end\n\n\n-- Attach the metatable to the table\nsetmetatable(data, mt)\ndata.__mt = mt\n\nlocal subdata =  class(\"subdata\", data)\nprint(subdata)\n-- function data.__mt.__len(table)\n--      local i = 1\n--      for k,v in pairs(table) do\n--          i = i + 1\n--      end\n--      return i\n--  end\n\n-- print(data.a)     -- Output: 10\n-- print(data.c)     -- Output: 0 (uses __index)\n-- print(data)       -- Output: Data: a=10, b=20 (uses __tostring)\n-- print(#data)\n local newfunc_chunk = [[\n return {\n     d = 15,\n     e = function(b)\n         return 1+b\n     end\n }\n ]]\n \n local newfunc_chunk2 = [[\n    __mt.__len =  function(table)\n          local i = 1\n          for k,v in pairs(table) do\n              i = i + 1\n          end\n          return i\n      end\n     return __mt\n]]\n\n-- adding new keys to a table via chunk\n local function test_chunk_load()\n-- no custom env set therefore it will use current scripts env\n  local chunk, error = load(newfunc_chunk)\n  data.ext[#data.ext+1] = chunk()\n  print(data.d)\n  print(data)\n  -- this has to be returned \n  -- and the outer scope object has to be set to this function\n  -- or else the changes will\n  -- only be present within the same function\n  return data\n end\ndata = test_chunk_load()\nprint(data.d)\n -- Patching metatable by passing custom env with current metatable\n local function test_chunk_load2()\n     -- literally anything you want available has to be passed\n     -- even things like print\n      local custom_env = {\n          __mt = mt,\n          pairs = pairs\n          }\n    local chunk, error = load(newfunc_chunk2, \"Chunk\", \"t\", custom_env)\n    -- this does not need to return to affect the outer object\n   setmetatable(data, chunk())\n    print(#data)\nend\n\ntest_chunk_load2()\nprint(#data)\n```\n\n\n## String Extensions\n```lua\nfunction string:startswith(prefix, ins)\n\treturn self:sub(1, #prefix):equals(prefix, ins)\n\t-- return (ins and self:lower() or self):sub(1, #prefix) == (ins and prefix:lower() or prefix)\nend\n\nfunction string:endswith(suffix, ins)\n\treturn self:sub(- #suffix):equals(suffix, ins)\n\t-- return (ins and self:lower() or self):sub(-#suffix) == (ins and suffix:lower() or suffix)\nend\n\n\nfunction string:to_table()\n    local t = {}\n    for char in self:gmatch(\".\") do\n        t[#t + 1] = char\n    end\n    return t\nend\n\n-- ins = case insensitive\n-- Main purpose is to allow optional case insensitive handling with a single call\n-- if type_check is not true then we autoconvert to string as well (caller must be a string)\nfunction string:equals(str, ins)\n\tstr = (type(str) == \"string\" and str) or (str.to_string and str:to_string()) or tostring(str)\n\treturn (ins and self:lower() == str:lower()) or self == str\nend\n\n\n-- if you prefer function syntax over .. style concatenation\n-- note that we can't modify strings in place without using a proxy table\n-- that feature is desirable but not worth the effort\nfunction string:append(str)\n\tstr = (type(str) == \"string\" and str) or (str.to_string and str:to_string()) or tostring(str)\n\treturn self..str\nend\n\n\n-- remove trailing/leading whitespace\nfunction string:trim()\n\treturn self:match(\"^%s*(.-)%s*$\")\nend\n\n\n\nfunction string:patternescape()\n  return self:gsub(\"[%(%)%.%%%+%-%*%?%[%]%^%$]\", \"%%%1\")\nend\n\n-- remove all whitespace\nfunction string:strip()\n\tlocal s = self:gsub(\"%s+\", \"\")\n\treturn s\nend\n\nfunction string:letters()\n\tlocal s = self:gsub(\"%A\", \"\")\n\treturn s\nend\n\nfunction string:digits()\n\tlocal s = self:gsub(\"%D\", \"\")\n\treturn s\nend\n\nstring.numbers = string.digits\n\nfunction string:chars()\n\tlocal s = self:gsub(\"%W\", \"\")\n\treturn s\nend\n\n-- removes _2147... (the uobjectarray index) from spawned objects\nfunction string:trim_uobject()\n    local result = self:gsub(\"_%d+$\", \"\")\n    return result\nend\n\n-- ins = case insensitive\nfunction string:contains(subword, ins, start)\n\treturn ((ins and self:lower() or self):find((ins and subword:lower() or subword), start or 1, true) ~= nil)\nend\n\n-- not perfect by any means, but can handle UObject:get_address and the copy address GUI function in UEVR\nfunction string:to_address()\n\tif self:match(\"^%w+$\") ~= nil then\n\t\tif self:sub(1, 2) == \"0x\" then\n\t\t\treturn tonumber(self:sub(3, #self), 16)\n\t\telseif #self:letters() ~= 0 then\n\t\t\treturn tonumber(self, 16)\n\t\telse\n\t\t\treturn tonumber(self, 10)\n\t\tend\n\tend\n\treturn nil\nend\n\n```\n\n### Math Extensions\n\n```lua\nfunction math.clamp(x, min, max)\n  return x < min and min or (x > max and max or x)\nend\n\nlocal sqrt = math.sqrt\n function math.sign(x)\n  return x < 0 and -1 or 1\nend\nlocal sign = math.sign\nlocal exp = math.exp\n\nfunction math.when_gt(x, y)\n    return math.max(sign(x - y), 0.0)\nend\n\nfunction math.when_le(x, y)\n    return 1.0 - when_gt(x, y)\nend\n\nfunction math.when_lt(x, y)\n    return max(sign(y - x), 0.0)\nend\n\nfunction math.any_gt(compare, ...)\n    for i = 1, select(\"#\", ...) do\n        if select(i, ...) > compare then\n            return true\n        end\n    end\n    return false\nend\n\nfunction math.any_lt(compare, ...)\n    for i = 1, select(\"#\", ...) do\n        if select(i, ...) < compare then\n            return true\n        end\n    end\n    return false\nend\n\nfunction math.all_gt(compare, ...)\n    return not math.any_lt(compare, ...)\nend\n\nfunction math.all_lt(compare, ...)\n    return not math.any_gt(compare, ...)\nend\n```\n"},{"id":"glm","title":"Extending GLM Math Types","group":"Guides","md":"```lua\n\nVector3 = UE5 and Vector3d or Vector3f\nVector4 = UE5 and Vector4d or Vector4f\nVector2 = UE5 and Vector2d or Vector2f\nlocal fquat = UE5 and Quaterniond or Quaternionf\n-- in theory makes it ignore case. Patched in the backend anyway but still cool\nQuat = setmetatable({}, {__index = function(table, k)\n                                return fquat[k:lower()]\n                            end})\n\nfunction Vector4d:components()\n    return self.x, self.y, self.z, self.w\nend\n\n\nfunction Vector3:components()\n    return self.x, self.y, self.z\nend\n\nfunction Vector4f:components()\n    return self.x, self.y, self.z, self.w\nend\n\nfunction Quat:components()\n    return self.x, self.y, self.z, self.w\nend\n\nfunction Vector2f:components()\n    return self.x, self.y\nend\n\n\n\nlocal function pow(vec, p)\n    local x, y, z = vec.x, vec.y, vec.z\n    return Vector3f.new(x^p, y^p, z^p)\nend\n\n-- split table into keys and values so you can iterate key names as an array\nfunction take_values(_table)\n\tif is_array(_table) then return _table end\n\tlocal values = {}\n\tfor k, v in orderedPairs(_table) do\n\t\ttable.insert(values, v)\n\t\t\tend\n\treturn values\nend\n\nlocal function _unpack(t)\n    return table.unpack(take_values(t))\nend\n\n\nlocal vector_alias = {\n    false, Vector2f, Vector3, Vector4f\n}\nlocal component_idx = {\"x\", \"y\", \"z\", \"w\"}\n\nfunction vector(...)\n    return vector_alias[select('#', ...)].new(...)\nend\n\n---- local v = vector(1, 2) == Vector2f.new(1, 2)\n\nlocal function _mul(a, b)\n    return a*b\nend\n\nlocal function _div(a, b)\n    return a / b\nend\n\nlocal function _add(a, b)\n    return a + b\nend\n\nlocal function _sub(a, b)\n    return a - b\nend\n\nlocal function component_expression(func, a, b)\n    local c = min(select('#', a:components()), select('#', b:components()))\n    return vector(func(a.x, b.x), func(a.y, b.y), c > 2 and func(a.z, b.z) or nil, c > 3 and func(a.w, b.w) or nil)\nend\n\n-- patched in the backend\nlocal function vector_div(vec, s)\n    if type(s) == \"number\" then\n        return vec * (1 / s)\n    elseif s and s.x then\n        return component_expression(_div, vec, s)\n    end\nend\n\nfunction Vector3f.__div(a, b)\n    return vector_div(a, b)\nend\n\nfunction Vector3d.__div(a, b)\n    return vector_div(a, b)\nend\n\nfunction Vector2f.__div(a, b)\n    return vector_div(a, b)\nend\n\nfunction Vector4f.__div(a, b)\n    return vector_div(a, b)\nend\n\n-- print(\"div test\")\n\n-- local v = Vector3.new(2, 2, 2) / Vector3.new(1, 1, 1)\n-- print(v.x)\n\n\nlocal function vector_mult_structs(a, b)\n    local t = {X = a.X * b.X, Y = a.Y * b.Y}\n    if a.Z then t.Z = a.Z * b.Z\n    end\n    if a.W then t.W = a.W * b.W\n    end\n    return t\nend\n\n\nlocal function _size(v)\n    for i = 1, 4 do\n        if v[component_idx[i]] == nil then\n            return i - 1\n        end\n    end\nend\n\n\n-- this is really satisfying butnot very useful once my lua api update gets merged\nlocal struct_comps = {\n        {\"X\"},\n        {\"X\", \"Y\"},\n        {\"X\", \"Y\", \"Z\"},\n        {\"X\", \"Y\", \"Z\", \"W\"},\n    }\nlocal function table_from_variadic(...)\n    local t = {}\n    for i,v in ipairs(struct_comps[select(\"#\", ...)]) do\n        t[v] = select(i, ...)\n    end\n    return t\nend\n\n-- Shorthand vector creation from a table\n-- You can use table constructor syntax and omit the parentheses\n-- this is less optimized than just using a vector but its still interesting\n\n-- e.g. v2f{0,0}\nfunction v3f(t)\n    return Vector3f.new(_unpack(t))\nend\n\n\n\nfunction Vector3:distance(other)\n    return (self - other):length()\nend\n\n\nfunction Vector3:calc_lookat(other)\n    local v =  other - self\n    local distance = v:length()\n    return v:normalized(), distance\nend\n\n\n\nfunction Vector3:extrapolate(other, distance)\n    return other +  (other - self) * distance\nend\n\nfunction Vector2:extrapolate(other, distance)\n    return other +  (other - self) * distance\nend\n\nfunction Vector2:distance(other)\n    return (self - other):length()\nend\n\n\n-- vp = point on plane, vn = plane normal\nfunction Vector3:project_intersection_onto_plane(vp, vn)\n    local dir = self - vp\n     vn:normalize()\n    local vdot = dir:dot(vn)\n    local vproj = vn * vdot\n    return self - vproj\nend\n\nlocal function normalize(...)\n    for i = 1, select(\"#\", ...) do\n        local v = select(i, ...)\n        v:normalize()\n    end\nend\nlocal function quat_vector(q)\n    return vector(q.X, q.Y, q.Z)\nend\n\nfunction Vector3:rotate(quat)\n    local q_vec = vector(quat.X, quat.Y, quat.Z)\n    local temp = q_vec:cross(self) + (self * quat.W)\n    local result = self + (q_vec:cross(temp) * 2)\n    return result * rad2deg\nend\n\n\n"},{"id":"out-params","title":"Automatic UFUNCTION Out Parameters","group":"API & reference","md":"The following technique allows for automatic out parameter handling when calling ufunctions. UEVR handles out arguments by putting the data into a a.result where a is an empty table passed for the out param. To retrieve the data one would need to manually create a table for every possible out param and then manually retrieve it after calling the function. However by using table.unpack and some lua memory addressing knowledge we can dynamically handle this. Everywhere, for all functions UEVR supports. The perfect example is BreakHitResult. This function allows us to pass table or actual hitresult data and split everything into tables without needing to handle UE versions changing the hitresult struct. These functions provided below can received tables with parameter names as keys and input arguments as values and will automatically fill only the needed out arguments with empty tables.\n\n\n```lua\n\nlocal function build_out_params(func)\n    local params = func:as_function():get_child_properties()\n    local out = {}\n    local order = {}\n    while params ~= nil do\n        local p = params:get_fname():to_string()\n            print(#order, p)\n            local param_class = params:get_class()\n            if func:as_struct():find_property(p):is_out_param() then\n                out[p] = {}  -- dynamically create empty table\n            end\n            -- this is equivalent to table.insert but is more optimal\n            order[#order+1] = p\n        params = params:get_next()\n    end\n    return out, order\nend\n              \nfunction string:find_first_of(include_cdo)\n    return UEVR_UObjectHook.get_first_object_by_class(api:find_uobject(self), include_cdo)\nend\n\n-- this allows for version independent hitresult analysis \nfunction BreakHitResult(hitresult)\n    Statics = (\"Class /Script/Engine.GameplayStatics\"):find_first_of(true)\n    local func = Statics.BreakHitResult\n    local tbls = {}\n\n     local tbls, order = build_out_params(func)\n    -- Collect arguments in order\n    -- start with the hitresult already in the table\n\n   local args = {}\n   tbls[\"Hit\"] = hitresult\n    -- this is the same as table.insert, we cant just do args[i] since we have  to offset by 1\n    -- for i, name in ipairs(order) do\n    --     args[#args+1] = args[#args+1] or tbls[name]\n    -- end\n    for i, name in ipairs(order) do\n        args[i] = tbls[name]\n    end\n    -- unpack the empty tables\n    -- despite having no data in each table and\n    -- despite table.unpack technically generating new values\n    -- tbls still keeps references to each of them allowing us to retrieve the results\n    Statics:BreakHitResult(table.unpack(args))\n\n    -- Build results map\n    -- This is simple here due to the function only taking out params\n    -- but even if it didn't we would still know the order\n    -- without the ordering steps we can get the data but we won't know which result goes where\n    local results = { }\n    for i = 2, #args do\n        local name = order[i]\n        results[name] =  tbls[name].result\n    end\n    return results\nend\n```\n\nHere's a version specific implementation that only works for BreakHitResult and won't handle future version changes if they occur\n```lua\nfunction M.getCleanHitResult(hitResult)\n\tif hitResult ~= nil then\n\t\tlocal bBlockingHit = {}\n\t\tlocal bInitialOverlap = {}\n\t\tlocal Time = {}\n\t\tlocal Distance = {}\n\t\tlocal Location = {}\n\t\tlocal ImpactPoint = {}\n\t\tlocal Normal = {}\n\t\tlocal ImpactNormal = {}\n\t\tlocal PhysMat = {}\n\t\tlocal HitActor = {}\n\t\tlocal HitComponent = {}\n\t\tlocal HitBoneName = {}\n\t\tlocal HitItem = {}\n\t\tlocal ElementIndex = {}\n\t\tlocal FaceIndex = {}\n\t\tlocal TraceStart = {}\n\t\tlocal TraceEnd = {}\n\n\t\t--static void BreakHitResult(const struct FHitResult& Hit, bool* bBlockingHit, bool* bInitialOverlap, float* Time, float* Distance, struct FVector* Location, struct FVector* ImpactPoint, struct FVector* Normal, struct FVector* ImpactNormal, class UPhysicalMaterial** PhysMat, class AActor** HitActor, class UPrimitiveComponent** HitComponent, class FName* HitBoneName, class FName* BoneName, int32* HitItem, int32* ElementIndex, int32* FaceIndex, struct FVector* TraceStart, struct FVector* TraceEnd);\n\t\tlocal success = pcall(function()\n\t\t\tStatics:BreakHitResult(hitResult, bBlockingHit, bInitialOverlap, Time, Distance, Location, ImpactPoint, Normal, ImpactNormal, PhysMat, HitActor, HitComponent, HitBoneName, HitItem, ElementIndex, FaceIndex, TraceStart, TraceEnd )\n\t\tend)\n\t\tif not success then\n\t\t\t--M.print(\"BreakHitResult failed, falling back to hitResult fields\", LogLevel.Warning)\n\t\tend\n\n\t\tlocal details = {}\n\t\tdetails.FaceIndex = hitResult.FaceIndex\n\t\tdetails.Time = hitResult.Time\n\t\tdetails.Distance = hitResult.Distance\n\t\tdetails.Location = M.vector(hitResult.Location)\n\t\tdetails.ImpactPoint = M.vector(hitResult.ImpactPoint)\n\t\tdetails.Normal = M.vector(hitResult.Normal)\n\t\tdetails.ImpactNormal = M.vector(hitResult.ImpactNormal)\n\t\tdetails.TraceStart = M.vector(hitResult.TraceStart)\n\t\tdetails.TraceEnd = M.vector(hitResult.TraceEnd)\n\t\tdetails.PenetrationDepth = hitResult.PenetrationDepth\n\t\tdetails.Item = hitResult.Item\n\t\tdetails.ElementIndex = hitResult.ElementIndex\n\t\tdetails.bBlockingHit = hitResult.bBlockingHit\n\t\tdetails.bStartPenetrating = hitResult.bStartPenetrating\n\t\tdetails.PhysMaterial = PhysMat.result\n\t\tdetails.Actor = HitActor.result\n\t\tdetails.Component = HitComponent.result\n\t\tdetails.BoneName = HitBoneName.result and HitBoneName.result:to_string() or nil\n\t\tdetails.MyBoneName = hitResult.MyBoneName and hitResult.MyBoneName:to_string() or nil\n\t\treturn details\n\tend\n\treturn nil\nend\n\n\n```\n\nWhich one is better?\n"},{"id":"draw-api","title":"Draw API","group":"API & reference","md":"# draw\n\nA subset of [ImGui](imgui.md) accessed through a separate table `draw`. Invokable in the same conditions as `imgui` methods, i.e. within `uevr.sdk.callbacks.on_frame`, `uevr.sdk.callbacks.on_draw_ui` and within [Script Panels](../lua.md). Draw calls are added to current window's background draw list but do not modify the ImGui cursor position nor interact with any logical components of ImGui.\n\nNote that as with ImGui, draw API is compatible with VR but is not well suited for in-game overlays, especially when projecting 3D world positions to the 2D screen. ImGui and draw API calls are projected in VR on the same plane as the UEVR UI and can be adjusted accordingly, but all scaling from the desktop screen is handled by UEVR.\n\n# Code Examples\n\n## Object trail \n\nAlthough VR isn't really supported for imgui in UEVR I actually made this with the intent of tracking motion controller gestures\n```lua\nfunction Vector3f:world_to_screen()\n    local out = {}\n    pc = pc or api:get_player_controller(0)\n    Statics:ProjectWorldToScreen(pc, self, out, true)\n    return Vector2f.new(out.result.X, out.result.Y)\nend\n\n\nlocal function draw_motion_path(object, path, maxpt, color, alt_method)\n      local screen_location\n      local last_screen_location\n      local vmag = object:get_outer():GetVelocity():length()\n       path = path or {}\n      if #path >= maxpt or vmag == 0  then\n        while #path > maxpt do\n          table.remove(path, 1)\n            end\n        end\n      table.insert(path, object:get_outer():K2_GetActorLocation())\n      imgui.begin_window(\"###Canvas\", true, 209599)\n      imgui.draw_list_path_clear()\n      -- draw api version\n      -- uses draw_line so no thickness\n      -- has to store 1 location or calculate 2 locations \n      -- so its worse right? well yes but actually no because its more flexible\n      if alt_method then\n            if #path >= 2 then\n            -- just hold 2 points and get one at a time very simple\n              for i = 2, #path do\n                local v = path[i]\n                last_screen_location  = path[i-1]:world_to_screen()\n                if last_screen_location.x + last_screen_location.y ~= 0 then\n                    screen_location = v:world_to_screen()\n                    if screen_location.x + screen_location.y ~= 0 then\n                        local _color = color\n                        -- Here's why its worthwhile\n                        -- path_stroke has to color everything at once with the same color, but with this we can decrease alpha to have a fading trail\n                        _color.w = math.max(1.0 - (i / #path), 0.3)\n                        draw.line(last_screen_location.x, last_screen_location.y, screen_location.x, screen_location.y, VecToU32(_color))\n                        end\n                    end\n                end\n            end\n        else\n            for i,v in ipairs(path) do\n                screen_location = v:world_to_screen()\n                if screen_location.x + screen_location.y == 0 then\n                    imgui.draw_list_path_clear()\n                else\n                    imgui.draw_list_path_line_to(screen_location)\n                end\n            end\n            imgui.draw_list_path_stroke(color, false, 12)\n        end\n        if screen_location and vmag ~= 0 then\n          imgui.set_cursor_screen_pos(screen_location - Vector2f.new(0, 200))\n          imgui.text(\"velocity magnitude: \"..tostring(vmag))\n      end\n    imgui.end_window()\nend\n\nlocal points = {}\nlocal capsule = api:get_local_pawn(0).CapsuleComponent or api:get_local_pawn(0).RootComponent\nuevr.sdk.callbacks.on_frame(function()\n    if capsule then\n        draw_motion_path(capsule, points, 500, 0xB1A3D9D8)\n    end\nend)\n```\n\nComplete example of using draw API with UEVR_UObjectHook to project a circle on screen space for every skeletal mesh\n```lua\n  -- draw api takes U32 hex integers for colors \n  local function VecToU32(vec)\n      local r = math.floor(math.max(0, math.min(255, vec.x * 255 + 0.5)))\n      local g = math.floor(math.max(0, math.min(255, vec.y * 255 + 0.5)))\n      local b = math.floor(math.max(0, math.min(255, vec.z * 255 + 0.5)))\n      local a = math.floor(math.max(0, math.min(255, vec.w * 255 + 0.5)))\n      -- ImGui expects 0xAABBGGRR\n      return (a << 24) | (b << 16) | (g << 8) | r\n  end\n\n\n  pc = api:get_player_controller(0)\n  local fill_color = 0xB1A3D9D8\n  -- some constants\n  local UE_WORLD_MAX = 2097152.0\n  local MIN_DISTANCE = 850.0\n  local RADIUS_SCALE = 0.6\n  local MAX_DISTANCE = 6000\n\n  local function scale_by_distance(world_location, distance, min_radius, max_radius)\n    if distance > MAX_DISTANCE then MAX_DISTANCE = distance * 1.1 end\n    local d = math.min(math.max(distance, MIN_DISTANCE), MAX_DISTANCE)\n    -- log scaling for more of a curve\n    local t = (math.log(d) - math.log(MIN_DISTANCE)) / (math.log(MAX_DISTANCE) - math.log(MIN_DISTANCE))\n    t = math.min(math.max(t, 0.0), 1.0)\n    -- lerp specified radius scale by log scaled distance\n    local radius = max_radius + (min_radius - max_radius) * t\n  return radius\nend\n\nlocal function get_screen_position(world_location)\n  local screen_location = {}\n  GameplayStatics:ProjectWorldToScreen(pc, world_location, screen_location, true)\n  return Vector2f.new(screen_location.result.X, screen_location.result.Y)\nend\n\n\nlocal resolution = imgui.get_display_size()\n\nlocal function object_draw_call(object)\n  if UEVR_UObjectHook.exists(object) then\n    -- get location from the actor\n    local world_location = object.K2_GetComponentLocation and object:K2_GetComponentLocation() or object:get_outer():K2_GetActorLocation()\n    -- raise the height a bit since it will give us the location of the root bone which is between their feet\n    world_location.z = world_location.z + 50\n    -- project the world location to screen\n    local screen_position = get_screen_position(world_location)\n    if not screen_position then return end\n    -- check that the object is actually on screen (could limit to portion of the screen easily)\n    -- if you're doing anything more complex, e.g. checking for mouse over you should have a function to check if the point is in a rectangle\n    if screen_position and screen_position.x and (screen_position.x < resolution.x and screen_position.x > 0) and\n     screen_position.y and (screen_position.y < resolution.y and screen_position.y > 0) then\n\n      -- scale the size of the output circle using glm Vec3 bindings\n      -- GetFocalLocation gives the location of the camera itself, not the pawn or player controller\n      local distance = (world_location - pc:GetFocalLocation()):length()\n      local radius = scale_by_distance(world_location, distance, 4.0, 48.0) * RADIUS_SCALE\n\n      -- use the radius scaling to simplify the circle and reduce draw call complexity, math.floor to get an integer\n      local segments = math.floor(radius * 0.25)\n      draw.filled_circle(screen_position.x, screen_position.y, radius, fill_color, segments)\n      -- add a slight outline\n      draw.outline_circle(screen_position.x, screen_position.y, radius * 1.01, VecToU32(Vector4f.new(1.0, 1.0, 1.0, 1.0)), segments)\n      -- add text to the draw list\n      draw.text(\"Distance: \"..tostring(math.floor(distance)), screen_position.x, math.max(0,screen_position.y - radius * 2), fill_color)\n      draw.text(\"Radius: \"..tostring(math.floor(radius)), screen_position.x, math.max(0, screen_position.y - radius), fill_color)\n      end\n  end\nend\n  \n  \n  local mesh_comps\n  local skinnedmesh = api:find_uobject(\"Class /Script/Engine.SkinnedMeshComponent\")\n  \n  \n  uevr.sdk.callbacks.on_frame(function()\n      mesh_comps = mesh_comps or skinnedmesh:get_objects_matching(false)\n      resolution = resolution or imgui.get_display_size()\n      -- make a full sized window with flags to hide the background, prevent focus, and ignore inputs\n      imgui.set_next_window_size(resolution)\n      imgui.set_next_window_pos(Vector2f.new(0, 0))\n      imgui.begin_window(\"###Canvas\", true, 209599)\n      if mesh_comps then\n          for i, object in ipairs(mesh_comps) do\n              object_draw_call(object)\n          end\n      end\n      imgui.end_window()\n  end)\n\n```\n# Methods\n\n## draw.text(text, x, y, color)\n## draw.filled_rect(x, y, w, h, color)\n## draw.outline_rect(x, y, w, h, color)\n## draw.line(x1, y1, x2, y2, color)\nNo way to set thickness, better to use a rect or use path_line_to\n## draw.outline_circle(x, y, radius, color, num_segments)\n## draw.filled_circle(x, y, radius, color, num_segments)\n## draw.outline_quad(x1, y1, x2, y2, x3, y3, x4, y4, color)\n## draw.filled_quad(x1, y1, x2, y2, x3, y3, x4, y4, color)\n\n\n# Clips\n\n## Pong\nhttps://github.com/user-attachments/assets/7b83ba61-fa8e-4f68-8466-c968f594c853\n\n## Motion Trail\nhttps://github.com/user-attachments/assets/0d488a54-b5f5-4137-92bf-628781cca376\n\n## Bones\n\nhttps://github.com/user-attachments/assets/fcde0451-89ca-4c1a-9bb5-9ef0d2b23900\n\n## Bone selection/highlighting\n\nhttps://github.com/user-attachments/assets/12410f74-0430-4fb3-96ca-a2d8142007c9\n\n\n\n## Scene Component trackers\nhttps://github.com/user-attachments/assets/12e30581-c183-477f-995c-1849a0b1d8d6\n\n\n\n## Joystick\nhttps://github.com/user-attachments/assets/6a27168e-c0da-422d-a088-605807a3d0f2\n\n## Crosshair\nhttps://github.com/user-attachments/assets/cd3aa854-fa8d-412b-9038-8ccd0c401d7b\n\n\n## Knob\n\nhttps://github.com/user-attachments/assets/c485a6e1-478a-4e17-ac35-88d150344cf2\n\n\n"},{"id":"styling","title":"Styling the UEVR Main GUI","group":"API & reference","md":"Neither of these matter as I've added a style editor directly to UEVR for the imgui update coming but these cases are worth archiving\n\nModern version\n\n```lua\n\n\nlocal functions = uevr.params.functions\nUEVR_TAG = functions.get_tag()\napi = uevr.api\nUEVR_COMMITS_PAST_TAG = functions.get_commits_past_tag()\nUEVR_COMMIT_HASH = functions.get_commit_hash()\nUEVR_NAME = \"UEVR [\"..tostring(UEVR_TAG)..\"+\"..tostring(UEVR_COMMITS_PAST_TAG)..\"-\"..(tostring(UEVR_COMMIT_HASH):sub(1,8))..\"]\"\n colors = {\n        Vector4f.new(1.00, 1.00, 1.00, 1.0),\n        Vector4f.new(0.86, 0.93, 0.89, 0.68),\n        Vector4f.new(0.13, 0.14, 0.17, 0.70),\n        Vector4f.new(0.13, 0.14, 0.17, 1.0),\n        Vector4f.new(0.31, 0.31, 1.00, 0.04),\n        Vector4f.new(0.00, 0.00, 0.00, 0.00),\n        Vector4f.new(0.20, 0.22, 0.27, 1.00),\n        Vector4f.new(0.92, 0.18, 0.29, 0.78),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.20, 0.22, 0.27, 1.00),\n        Vector4f.new(0.20, 0.22, 0.27, 0.75),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.20, 0.22, 0.27, 0.47),\n        Vector4f.new(0.20, 0.22, 0.27, 1.00),\n        Vector4f.new(0.09, 0.15, 0.16, 1.00),\n        Vector4f.new(0.92, 0.18, 0.29, 0.78),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.71, 0.22, 0.27, 1.00),\n        Vector4f.new(0.47, 0.77, 0.83, 0.14),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.47, 0.77, 0.83, 0.14),\n        Vector4f.new(0.92, 0.18, 0.29, 0.86),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.92, 0.18, 0.29, 0.76),\n        Vector4f.new(0.92, 0.18, 0.29, 0.86),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.14, 0.16, 0.19, 1.00),\n        Vector4f.new(0.92, 0.18, 0.29, 0.78),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.47, 0.77, 0.83, 0.04),\n        Vector4f.new(0.92, 0.18, 0.29, 0.78),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.86, 0.93, 0.89, 0.63),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.86, 0.93, 0.89, 0.63),\n        Vector4f.new(0.92, 0.18, 0.29, 1.00),\n        Vector4f.new(0.92, 0.18, 0.29, 0.43),\n        Vector4f.new(0.20, 0.22, 0.27, 0.9),\n        Vector4f.new(0.20, 0.22, 0.27, 0.73),\n    }\nfunction VecToU32(vec)\n    local r = math.floor(math.max(0, math.min(255, vec.x * 255 + 0.5)))\n    local g = math.floor(math.max(0, math.min(255, vec.y * 255 + 0.5)))\n    local b = math.floor(math.max(0, math.min(255, vec.z * 255 + 0.5)))\n    local a = math.floor(math.max(0, math.min(255, vec.w * 255 + 0.5)))\n\n    -- ImGui expects 0xAABBGGRR\n    return (a << 24) | (b << 16) | (g << 8) | r\nend\n\n\n\nlocal stylevar = {\n\n--Alpha\",\n1.0,\n--DisabledAlpha\",\n0.7,\n--WindowPadding\",\nVector2f.new(2.0, 2.0),\n--WindowRounding\",\n10.0,\n--WindowBorderSize\",\n2.0,\n--WindowMinSize\",\nVector2f.new(60.0, 120.0),\n\n--WindowTitleAlign\",\nVector2f.new(0.5, 0.5),\n\n--ChildRounding\",\n8,\n--ChildBorderSize\",\n2,\n--PopupRounding\",\n10,\n--PopupBorderSize\",\n2,\n--FramePadding\",\n0.5,\n--FrameRounding\",\n10,\n--FrameBorderSize\",\n0.0,\n--ItemSpacing\",\nVector2f.new(2.0, 2.0),\n\n--ItemInnerSpacing\",\nVector2f.new(2.0, 2.0),\n\n--IndentSpacing\",\n8,\n--CellPadding\",\nVector2f.new(2.0, 2.0),\n\n--ScrollbarSize\",\n22,\n--ScrollbarRounding\",\n10,\n--GrabMinSize\",\n15,\n--GrabRounding\",\n12,\n--TabRounding\",\n0,\n--ButtonTextAlign\",\nVector2f.new(0.5, 0.5),\n\n--SelectableTextAlign\",\n\n--SeparatorTextBorderSize\",\n\n--SeparatorTextAlign\",\n\n--SeparatorTextPadding\"\n\n}\n\nlocal res\nlocal no_inputs = false\nlocal menu_bar = true\nlocal no_nav = true\nlocal set_pos = false\nlocal set_size = false\nlocal window_size = Vector2f.new(1000, 500)\nlocal window_pos = res and res * 0.5 or Vector2f.new(0,0)\nuevr.sdk.callbacks.on_frame(function()\n    res = res or imgui.get_display_size()\n    local colorcount=0\n    local stylecount=0\n    if functions.is_drawing_ui() then\n        imgui.push_font(imgui.load_font(\"Comic.ttf\", 16))\n        for i,v in ipairs(colors) do\n                colorcount = colorcount + 1\n            imgui.push_style_color(i-1, VecToU32(v))\n        end\n        for i,v in ipairs(stylevar) do\n            stylecount = stylecount +1\n            imgui.push_style_var(i-1,v)\n        end\n        no_inputs = imgui.is_key_pressed(571)\n\n        imgui.begin_window(UEVR_NAME, true, 0 + (no_inputs and 197120 or 0) + (menu_bar and 1024 or 0) + (no_nav and 196608 or 0))\n        if imgui.begin_menu_bar() then\n            if imgui.begin_menu(\"HACKS\") then\n                imgui.menu_item(\"Placeholder\")\n                imgui.end_menu()\n            end\n            imgui.end_menu_bar()\n        end\n        imgui.end_window()\n        imgui.pop_style_color(colorcount)\n        imgui.pop_style_var(stylecount)\n        imgui.pop_font()\n    end\nend)\n\n\n\n```\n\n\n\n\n\n\nOriginal Hacky version (literally intentionally memleaked and attempted to manually prevent stack corruption to usually good results)\n\n```lua\nlocal excluded_colors = {Tab = true, TabHovered = true, TabActive = true, TabUnfocused = true, TabUnfocusedActive = true, PlotLines = true, PlotLinesHovered = true, PlotHistogram = true, PlotHistogramHovered = true, ModalWindowDimBg = true}\nlocal color_edit = true\nlocal temp_styles = {}\nlocal jsonstyles = {}\nlocal style_name = \"\"\nlocal colors_to_pop = 0\nlocal color_flags = ImGui.CalcFlags({\"NoSidePreview\", \"AlphaBar\", \"NoBorder\"}, \"ColorEdit\")\nfunction ImGui.ColorStylesMenu(colorStyles)\n\n    if colorStyles == nil then colorStyles = ImGuiThemes.default_dark.colors end\n    temp_styles = temp_styles or colorStyles\n    for k, v in pairs(temp_styles) do imgui.push_style_color(ImGui.Col(k), v)\n                        colors_to_pop = colors_to_pop + 1\n\n        end\n        if imgui.begin_menu(\"Color Style Editor\") then\n         local available_width = math.min(imgui.get_display_size().x * 0.55, math.max(imgui.get_window_size().x * 0.85))\n\n        -- local c, nn, s1, s2 = imgui.input_text(\"Style Name\", style_name, 0)\n        -- if c then style_name = nn end\n        -- imgui.begin_disabled(style_name == nil or #style_name == 0 )\n        -- if imgui.menu_item(\"Save\") then json.dump_file(\"CustomThemes\\\\\"..style_name..\".json\", jsonstyles, 4)\n\n        -- end\n        -- imgui.end_disabled()\n        if ImGui.ToggleButton({\"Use color picker widget\",\"Use color edit widget\"}, color_edit) then color_edit = not color_edit end\n        if imgui.menu_item(\"Reset all\") then temp_styles = ImGuiThemes.default_dark.colors end\n        local func = color_edit and imgui.color_edit4 or imgui.color_picker4\n        imgui.push_item_width(available_width)\n        for idx, val in ipairs(ImGuiCol) do\n                if not excluded_colors[val] then\n                    imgui.push_id(idx)\n                    local tcolor = temp_styles[val] or Vector4f.new(0.5, 0.5, 0.5, 1.0)\n                    -- imgui.text(val) imgui.same_line()\n                    local c, v = func(val, tcolor, color_flags)\n                    if c then tcolor = v\n                        temp_styles[val] = tcolor\n                        -- imgui.push_style_color(ImGui.Col(v), tcolor)\n                        -- colors_to_pop = colors_to_pop + 1\n\n                    end\n                    jsonstyles[val] = {tcolor.x, tcolor.y, tcolor.z, tcolor.w}\n\n                    imgui.pop_id()\n                end\n\n            end\n            imgui.pop_item_width()\n            imgui.end_menu()\n        end\n        if colors_to_pop ~= 0 then imgui.pop_style_color(colors_to_pop )\n        colors_to_pop = 0\n    end\n    colorStyles = temp_styles\n    return (colorStyles ~= temp_styles), temp_styles\nend\n\n\nfunction ImGui.ColorStyleEditor(colorStyles)\n    if colorStyles == nil then colorStyles = ImGuiThemes.default_dark.colors end\n    if ImGui.ToggleButton({\"Use color picker widget\",\"Use color edit widget\"}, color_edit) then color_edit = not color_edit end\n\n    imgui.same_line() if imgui.small_button(\"Reset all\") then return ImGuiThemes.default_dark.colors end\n    if imgui.collapsing_header(\"Style Editor\") then\n        for idx, val in ipairs(ImGuiCol) do\n\n            if not excluded_colors[val] then\n                imgui.push_id(val)\n                local tcolor = colorStyles[val] or Vector4f.new(0.5, 0.5, 0.5, 1.0)\n                imgui.text(val) imgui.same_line()\n                if color_edit then\n                    local c, v = imgui.color_edit4(val, tcolor, 0)\n                    if c then tcolor = v\n                        colorStyles[val] = tcolor\n                    end\n                else\n                    local c, v = imgui.color_picker4(val, tcolor, 0)\n                    if c then tcolor = v\n                        colorStyles[val] = tcolor\n                    end\n                end\n                imgui.pop_id()\n            end\n        end\n    end\n    return colorStyles\nend\n\n\n```\n"},{"id":"bonetree","title":"Bone Tree (snippet)","group":"Snippets","md":"```lua\n    panels[\"Bones\"] = function()\n       local function get_bone_parents(mesh, bones)\n          local t = {}\n          for  _, bone in ipairs(bones) do\n             local p = mesh:GetParentBone(bone:to_fname())\n             if p then t[bone] = p:to_string() end\n           end\n          return t\n        end\n        local function get_bone_names(mesh)\n            local t = {}\n            for i = 1, mesh:GetNumBones() do\n                t[#t+1] = mesh:GetBoneName(i - 1)\n            end\n            return t\n        end\n        local function bone_node(idx, val)\n          for _idx, _val if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

function render(id){
  const d = byId[id] || DOCS[0];
  document.getElementById('docGroup').textContent = d.group;
  const html = (window.marked ? (marked.parse ? marked.parse(d.md) : marked(d.md)) : ('<pre>'+d.md.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre>'));

  if (d.id === 'overview') {
    body += '<a class="repo-cta" href="https://github.com/lobotomy-x/Unreal-Lua-Library" target="_blank" rel="noopener">View full library on GitHub ↗</a>';
  }
  document.getElementById('docBody').innerHTML = body;
  document.querySelectorAll('.side-link').forEach(a => a.classList.toggle('active', a.dataset.id===d.id));
  document.querySelector('.content').scrollTo ? window.scrollTo(0,0) : null;
  window.scrollTo(0,0);
  closeMenu();
}
function currentId(){ return location.hash.replace('#','') || DOCS[0].id; }

scrim.addEventListener('click', closeMenu);
