<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UEVR Docs · Logan Brunet</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<template id="__bundler_thumbnail" data-bg-color="#0a0b0e">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0a0b0e"/>
    <g transform="translate(600,360)">
      <rect x="-150" y="-120" width="300" height="240" rx="12" fill="none" stroke="#9d8bff" stroke-width="6"/>
      <path d="M-95,-55 L-55,-15 L-95,25" stroke="#9d8bff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-35" y1="25" x2="55" y2="25" stroke="#9d8bff" stroke-width="10" stroke-linecap="round"/>
    </g>
    <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="30" fill="#7d8597" letter-spacing="4">UEVR · DOCS</text>
  </svg>
</template>
<style>
:root{
  --bg:#0a0b0e; --panel:#11131a; --panel-2:#161922;
  --line:rgba(180,200,230,.08); --line-2:rgba(180,200,230,.14);
  --text:#e3e6ed; --text-2:#b3b8c5; --muted:#7d8597; --faint:#4f5466;
  --accent:#56d8ff; --lua:#9d8bff;
  --radius:8px;
  --font:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace; --serif:"Instrument Serif",serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased; scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.6;}
a{color:var(--accent); text-decoration:none;}
a:hover{text-decoration:underline;}

.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px; background:color-mix(in oklab,var(--bg) 88%,transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);}
.back-link{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted);}
.back-link:hover{color:var(--text); text-decoration:none;}
.topbar-title{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--lua);}
.topbar-links{display:flex; gap:18px; align-items:center;}
.topbar-links a{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
.topbar-links a:hover{color:var(--text); text-decoration:none;}

.layout{display:grid; grid-template-columns:288px 1fr; max-width:1240px; margin:0 auto; align-items:start;}
.sidebar{position:sticky; top:53px; align-self:start; height:calc(100vh - 53px); overflow-y:auto;
  padding:24px 18px 40px; border-right:1px solid var(--line);}
.side-head{font-family:var(--serif); font-size:24px; font-style:italic; color:var(--text); margin:0 0 4px; padding:0 10px;}
.side-sub{font-family:var(--mono); font-size:10.5px; color:var(--muted); padding:0 10px; margin-bottom:16px;}
.coll-switch{display:flex; gap:6px; padding:0 6px; margin-bottom:18px; flex-wrap:wrap;}
.coll-btn{font-family:var(--mono); font-size:10.5px; padding:6px 10px; border:1px solid var(--line-2); border-radius:100px;
  color:var(--muted); background:none; cursor:pointer;}
.coll-btn:hover{color:var(--text);}
.coll-btn.active{color:var(--bg); background:var(--lua); border-color:var(--lua);}
.side-group{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); margin:16px 0 6px; padding:0 10px;}
.side-link{display:block; padding:6px 10px; border-radius:6px; font-size:13px; color:var(--text-2); cursor:pointer; border-left:2px solid transparent; background:none; border-top:none; border-right:none; width:100%; text-align:left; font-family:inherit;}
.side-link:hover{background:var(--panel); color:var(--text); text-decoration:none;}
.side-link.active{background:var(--panel-2); color:var(--lua); border-left-color:var(--lua);}

.content{padding:40px 56px 120px; min-width:0; max-width:860px;}
.doc-eyebrow{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--lua); margin-bottom:8px;}
.loading{color:var(--muted); font-family:var(--mono); font-size:13px;}
.md h1{font-family:var(--font); font-size:32px; font-weight:600; letter-spacing:-.015em; margin:0 0 18px; line-height:1.15;}
.md h2{font-size:22px; font-weight:600; margin:36px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--line); letter-spacing:-.01em;}
.md h3{font-size:17px; font-weight:600; margin:26px 0 8px; color:var(--text);}
.md h4{font-size:14px; font-weight:600; margin:20px 0 6px; color:var(--text-2); font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em;}
.md p{margin:0 0 14px; color:var(--text-2);}
.md ul,.md ol{margin:0 0 14px; padding-left:22px; color:var(--text-2);}
.md li{margin:4px 0;}
.md a{border-bottom:1px dashed var(--line-2);}
.md a:hover{text-decoration:none; border-bottom-color:var(--accent);}
.md strong{color:var(--text); font-weight:600;}
.md em{color:var(--text);}
.md hr{border:none; border-top:1px solid var(--line); margin:28px 0;}
.md blockquote{margin:0 0 14px; padding:2px 16px; border-left:3px solid var(--lua); color:var(--muted); background:var(--panel);}
.md code{font-family:var(--mono); font-size:12.5px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--accent);}
.md pre{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; overflow-x:auto; margin:0 0 16px;}
.md pre code{background:none; border:none; padding:0; color:var(--text-2); font-size:12.5px; line-height:1.55; display:block;}
.md table{border-collapse:collapse; width:100%; margin:0 0 16px; font-size:13px;}
.md th,.md td{border:1px solid var(--line); padding:8px 12px; text-align:left;}
.md th{background:var(--panel-2); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:400;}
.md td{color:var(--text-2);}
.md img{max-width:100%; border-radius:6px; border:1px solid var(--line);}
.repo-cta{display:inline-block; margin-top:8px; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em;
  padding:9px 16px; border:1px solid var(--lua); color:var(--lua); border-radius:6px;}
.repo-cta:hover{background:var(--lua); color:var(--bg); text-decoration:none;}

.menu-btn{display:none;}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:fixed; top:53px; left:0; bottom:0; width:288px; z-index:30; background:var(--bg);
    transform:translateX(-100%); transition:transform .2s; height:auto;}
  .sidebar.open{transform:translateX(0);}
  .content{padding:28px 22px 100px;}
  .menu-btn{display:inline-block; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text); background:none; border:none; cursor:pointer;}
  .scrim{display:none; position:fixed; inset:53px 0 0 0; background:rgba(0,0,0,.6); z-index:25;}
  .scrim.open{display:block;}
}
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="back-link">← Logan Brunet · Portfolio</a>
  <span class="topbar-title">UEVR · Docs</span>
  <div class="topbar-links">
    <button class="menu-btn" id="menuBtn">Menu</button>
    <a id="repoLink" href="#" target="_blank" rel="noopener">GitHub ↗</a>
    <a id="dashLink" href="UEVR-Luavrlib-Dashboard.html">Dashboard ↗</a>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="side-head" id="sideHead">Docs</div>
    <div class="side-sub" id="sideSub"></div>
    <div class="coll-switch" id="collSwitch"></div>
    <div id="navList"></div>
  </nav>
  <main class="content">
    <div class="doc-eyebrow" id="docGroup"></div>
    <article class="md" id="docBody"><div class="loading">Loading…</div></article>
  </main>
</div>

<script type="application/json" id="docs-manifest">
{

      "subtitle": "UEVR scripting guides & reference",

      "dashboard": "UEVR-Luavrlib-Dashboard.html",
      "base": "https://raw.githubusercontent.com/lobotomy-x/Unreal-Lua-Library/main/",
      "docs": [

        { "id": "lua-primer", "title": "Lua for Normal Programmers",        "group": "Guides",           "file": "Docs/UEVR/Lua For Normal Programmers.md" },
        { "id": "lua-tables", "title": "Optimizing Lua Tables",             "group": "Guides",           "file": "Docs/UEVR/LuaTablesBreakdown.md" },

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const mdCache = {};
  let manifest, collId, docId;

  function parseHash() {
    // #collection/doc
    const h = location.hash.replace(/^#/, "");
    const [c, d] = h.split("/");
    return { c: c || null, d: d || null };
  }

  async function loadMd(file) {
    if (mdCache[file]) return mdCache[file];
    const url = /^https?:\/\//.test(file) ? file : ((collection().base || "") + file);
    const res = await fetch(encodeURI(url));
    if (!res.ok) throw new Error("Could not load " + url + " (" + res.status + ")");
    const text = await res.text();
    mdCache[file] = text;
    return text;
  }

  function collection() { return manifest.collections.find((c) => c.id === collId) || manifest.collections[0]; }

  function buildSidebar() {
    const coll = collection();
    $("sideHead").textContent = coll.label;
    $("sideSub").textContent = coll.subtitle || "";
    $("repoLink").href = coll.repoUrl || "#";
    $("dashLink").href = coll.dashboard || "index.html";

    // collection switcher (only if >1)
    const sw = $("collSwitch"); sw.innerHTML = "";
    if (manifest.collections.length > 1) {
      manifest.collections.forEach((c) => {
        const b = document.createElement("button");
        b.className = "coll-btn" + (c.id === collId ? " active" : "");
        b.textContent = c.label;
        b.onclick = () => { location.hash = c.id + "/" + c.docs[0].id; };
        sw.appendChild(b);
      });
    }

    // grouped nav
    const nav = $("navList"); nav.innerHTML = "";
    const groups = [];
    coll.docs.forEach((d) => { let g = groups.find((x) => x.name === d.group); if (!g) { g = { name: d.group, items: [] }; groups.push(g); } g.items.push(d); });
    groups.forEach((g) => {
      const h = document.createElement("div"); h.className = "side-group"; h.textContent = g.name; nav.appendChild(h);
      g.items.forEach((d) => {
        const a = document.createElement("button");
        a.className = "side-link" + (d.id === docId ? " active" : "");
        a.textContent = d.title;
        a.onclick = () => { location.hash = collId + "/" + d.id; };
        nav.appendChild(a);
      });
    });
  }

  async function render() {
    const coll = collection();
    const doc = coll.docs.find((d) => d.id === docId) || coll.docs[0];
    docId = doc.id;
    $("docGroup").textContent = coll.label + " · " + doc.group;
    $("docBody").innerHTML = '<div class="loading">Loading ' + doc.title + '…</div>';
    buildSidebar();
    try {
      const md = await loadMd(doc.file);
      const html = window.marked ? (marked.parse ? marked.parse(md) : marked(md)) : md;
      let body = html;
      if (/overview/i.test(doc.id) && coll.repoUrl) {
        body += '<a class="repo-cta" href="' + coll.repoUrl + '" target="_blank" rel="noopener">View on GitHub ↗</a>';
      }
      $("docBody").innerHTML = body;
    } catch (e) {
      $("docBody").innerHTML = '<div class="loading">⚠ ' + e.message +
        '<br><br>Docs are fetched live from the source repos on GitHub. ' +
        'If a doc fails to load, the file may have moved in the repo — check Docs/manifest.json.</div>';
    }
    window.scrollTo(0, 0);
    closeMenu();
  }

  function applyHash() {
    const { c, d } = parseHash();
    collId = (manifest.collections.find((x) => x.id === c) || manifest.collections[0]).id;
    const coll = collection();
    docId = (coll.docs.find((x) => x.id === d) || coll.docs[0]).id;
    render();
  }

  // mobile menu
  const sidebar = $("sidebar"), scrim = $("scrim");
  window.closeMenu = function () { sidebar.classList.remove("open"); scrim.classList.remove("open"); };
  $("menuBtn").addEventListener("click", () => { sidebar.classList.toggle("open"); scrim.classList.toggle("open"); });
  scrim.addEventListener("click", window.closeMenu);

  if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

  // Manifest is embedded inline (below) so the page never depends on a relative
  // fetch — only the .md doc CONTENT is pulled live from the source repos.
  try {
    const inline = document.getElementById("docs-manifest");
    if (inline && inline.textContent.trim()) {
      manifest = JSON.parse(inline.textContent);
    } else {
      const res = await fetch("Docs/manifest.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      manifest = JSON.parse(await res.text());
    }
  } catch (e) {
    $("docBody").innerHTML =
      '<div class="loading">⚠ Could not load the docs manifest — ' + e.message + '.</div>';
    return;
  }
  window.addEventListener("hashchange", applyHash);
  applyHash();
})();
</script>
</body>
