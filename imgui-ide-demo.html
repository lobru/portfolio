<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ImGui-IDE · Try it</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root {
  --bg:    #0a0b0e; --panel: #11131a; --line: rgba(180,200,230,.10);
  --text:  #e3e6ed; --muted: #7d8597; --faint: #4f5466;
  --accent:#56d8ff; --shipped:#b3ec59;
  --mono:"Geist Mono",ui-monospace,monospace;
  --font:"Geist",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
a{color:var(--accent);text-decoration:none;}

/* ── chrome ── */
.bar{display:flex;align-items:center;gap:0;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;height:44px;padding:0 14px;}
.back{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 12px;border-right:1px solid var(--line);margin-right:12px;}
.back:hover{color:var(--text);}
.tabs{display:flex;gap:0;flex:1;}
.tab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:0 18px;height:44px;display:flex;align-items:center;gap:7px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;font:inherit;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--shipped);border-bottom-color:var(--shipped);}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--shipped);box-shadow:0 0 6px var(--shipped);}

/* ── notice ── */
.notice{background:color-mix(in oklab,var(--accent) 8%,var(--panel));border-bottom:1px solid color-mix(in oklab,var(--accent) 25%,var(--line));padding:8px 18px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-shrink:0;}
.notice strong{color:var(--text);}
.notice a{color:var(--accent);border-bottom:1px dashed currentColor;}
.notice-dismiss{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);cursor:pointer;padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:none;}
.notice-dismiss:hover{color:var(--text);}

/* ── frames ── */
.frame-wrap{flex:1;position:relative;overflow:hidden;}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
iframe.hidden{display:none;}
</style>
</head>
<body>

<div class="bar">
  <a href="imguicolortextedit.html" class="back">← Dashboard</a>
  <div style="font-family:var(--mono);font-size:12px;color:var(--text);flex:1;padding:0 16px;">ImGui-IDE · Cloud editor</div>
  <a href="https://github.com/lobru/ImGui-IDE/releases/tag/1.0" target="_blank" rel="noopener" style="font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding:0 14px;">Download desktop ↗</a>
</div>

<div class="notice" id="notice">
  <span>
    This is a browser-based build of ImGui-IDE — open any public GitHub repo and edit it live.
    It doesn't include the desktop app's Git integration, build system, or intellisense.
    <a href="https://github.com/lobru/ImGui-IDE/releases/tag/1.0" target="_blank" rel="noopener">Download the full desktop app ↗</a>
  </span>
  <button class="notice-dismiss" onclick="document.getElementById('notice').style.display='none'">Dismiss</button>
</div>

<iframe id="frame-cloud" src="imgui-ide-cloud.html" title="ImGui-IDE Cloud — open any GitHub repo" style="position:absolute;inset:0;width:100%;height:100%;border:none;"></iframe>
</body>
</html>
