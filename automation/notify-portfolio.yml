# notify-portfolio.yml  — TEMPLATE, copy into EACH target code repo
# ---------------------------------------------------------------------------
# Put this at  .github/workflows/notify-portfolio.yml  inside:
#     lobotomy-x/ImGuiColorTextEdit   (branch lobotomy/main)
#     lobotomy-x/uevr-frontend        (branch main)
#     lobotomy-x/Unreal-Lua-Library   (branch main)
#
# On every push it pings the portfolio repo, which then regenerates that
# project's dashboard data and redeploys the live site.
#
# One-time setup in the CODE repo:
#   Settings → Secrets and variables → Actions → New secret
#     PORTFOLIO_DISPATCH_TOKEN = a PAT with "Contents: write" (or repo scope)
#                                on lobru/portfolio
# ---------------------------------------------------------------------------
name: Notify portfolio

on:
  push:
    branches: [main, "lobotomy/main"]   # keep only the branch this repo uses
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to portfolio repo
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/lobru/portfolio/dispatches \
            -d '{"event_type":"source-updated","client_payload":{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
